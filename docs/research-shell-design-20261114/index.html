function designNotes(){const n=NOTES[state.page];modal('Design & implementation notes',`<span class="eyebrow">NOT_APPLIED_TO_PAPER</span><h3>${n[0]}</h3><p>${n[1]}</p><p>${n[2]}</p><h3>Prototype boundary</h3><p>All data, source names, report passages, account values and outcomes in this study are illustrative. Buttons exercise local design interactions only. No backend, account, order, report or production state is modified.</p><h3>Designed interaction contract</h3><ul><li>One primary task per workspace.</li><li>Named evidence inspection with keyboard and touch access.</li><li>Focus returns to the trigger on close.</li><li>Meaningful empty, partial, stale, unavailable and access states.</li><li>Responsive composition with no page-wide horizontal overflow.</li></ul><h3>Still owed</h3><p>Fresh existing-board inspection, editable Paper application and screenshot readback; full EN/ZH, tablet and interaction-state completion; actual engine/API binding, protected release and authenticated production proof.</p>`)}
function picker(){modal('Choose a research workspace',`<div class="search-dialog"><input id="workspace-query" aria-label="Find workspace" placeholder="Find a workspace" autocomplete="off"><div class="page-options">${PAGES.map(([p,n],i)=>`<button class="page-option" data-picker-page="${p}"><span>${String(i+1).padStart(2,'0')}</span>${n}</button>`).join('')}</div></div>`);setTimeout(()=>document.getElementById('workspace-query')?.focus(),40)}
function action(a){if(a.startsWith('shell-destination:')){modal(a.split(':')[1]+' · Shared shell','<p>This existing Terminal destination is outside the eleven Research workspaces included in this design study.</p><p>The production transition reuses its existing navigation and route owner.</p>');return}if(a.startsWith('read-report:')){openReport(Number(a.split(':')[1]));return}if(a.startsWith('save:')){const id=a.slice(5);state.saved.has(id)?state.saved.delete(id):state.saved.add(id);toast(state.saved.has(id)?'Saved in this design preview':'Removed from this design preview');return}if(a.startsWith('evidence:'))return sourceDetail(a.slice(9));if(a.startsWith('select-hub:')){state.hub=a.split(':')[1];state.hubTab='Briefing';render();return}switch(a){case'close-dialog':closeModal();break;case'page-picker':picker();break;case'reset-state':state.quality='ready';document.getElementById('state-control').value='ready';render();break;case'sources':sourceDetail(state.page);break;case'method':case'help':designNotes();break;case'saved':modal('Saved in this preview',state.saved.size?`<p>${state.saved.size} items retained for this local design session.</p><div class="page-options">${Array.from(state.saved).map(x=>`<div class="page-option">${ic('bookmark',15)}${esc(x)}</div>`).join('')}</div>`:'<p>Save a report, document or development to see how the collection behaves. This preview does not write to your account.</p>');break;case'read-report':state.reportOpen=true;state.reportSection='The thesis';render();document.querySelector('.main').scrollTop=0;break;case'close-report':returnFromReport();break;case'next-report':{const a=['The thesis','What changes','The countercase','What to watch'];state.reportSection=a[(a.indexOf(state.reportSection)+1)%4];render();document.querySelector('.main').scrollTop=0;break}case'report-history':modal('Edition history','<p>Keep the original report and its publication date. Later editions show what changed and link back to the original.</p>'+fact('Selected','03 Nov 2026 · Original specimen'));break;case'clear-vault':state.vaultQuery='';state.vaultFilter='All sources';render();break;case'vault-prev':state.vaultPassage=(state.vaultPassage+selectedPassages().length-1)%selectedPassages().length;render();break;case'vault-next':state.vaultPassage=(state.vaultPassage+1)%selectedPassages().length;render();break;case'toggle-earnings':state.earningsCompare=!state.earningsCompare;render();break;case'earnings-weekly':modal('Weekly earnings briefing','<p>One reading surface gathers the published event briefs. Selecting a claim opens its original source packet.</p>'+EARNINGS.map(x=>`<div class="newsline"><b>${x[0]}</b><p>${x[3]}</p></div>`).join(''));break;case'apply-filing':state.filingVersion=document.getElementById('filing-old').value==='Amended'?'Amended':'Original';closeModal();render();break;case'filing-compare':modal('Comparison basis',`<p>Choose the actual periods and versions before interpreting a redline.</p><div class="two-even"><div><label class="small" for="filing-old">Previous</label><select class="inline-input mt8" id="filing-old"><option value="Original" ${state.filingVersion==='Original'?'selected':''}>Q2 2026 · Original</option><option value="Amended" ${state.filingVersion==='Amended'?'selected':''}>Q2 2026 · Amended</option></select></div><div><span class="small">Selected</span><p class="mt8">Q3 2026 · Original</p></div></div><div class="row between mt20"><span class="small muted">Selected period: Q3 2026 · Original</span>${btn('Apply comparison','apply-filing','primary')}</div>`);break;case'network-meaning':modal('What a connection means','<p>A connection links an authorized source family to the selected instrument. It does not establish causation, add a vote weight or create a new score.</p><p>Selection highlights one source. Disagreement isolates contrary or mixed evidence without deleting the supporting evidence.</p>');break;case'toggle-disagreement':state.neuralDisagreement=!state.neuralDisagreement;if(state.neuralDisagreement)state.neuralNode='positioning';render();break;case'choose-instrument':modal('Instrument selection','<p>This specimen is focused on NVDA. Production selection must resolve the instrument through the existing shell identity owner.</p>'+fact('Instrument','NVDA · US equity')+'<p class="small">The network is illustrative; no live graph endpoint is assumed.</p>');break;case'memory-readings':case'memory-method':modal('Saved reading & comparison basis',`<p>Saved contemporaneous output retains its original cutoff. Retrospective comparisons are a separate task and may use only the authorized experiment population.</p>${EPISODES.map(x=>`<div class="cohort-row"><b>${x[0]}</b><small>${x[2]}</small></div>`).join('')}<p>Dates and curves here are illustrative design inputs. No historical experiment, holdout or future-return calculation has run.</p>`);break;case'return-hub':setPage('hub');break;case'morning-next':state.morningProgress=state.morningProgress%3+1;render();document.querySelectorAll('.edition-section')[state.morningProgress-1]?.scrollIntoView({block:'center',behavior:'auto'});break;case'morning-editions':modal('Previous editions','<p>Each edition keeps its original publication cutoff and source timestamps. A late update is an addition, not a rewrite of the morning view.</p>'+fact('Selected specimen','03 Nov 2026 · 08:15 ET'));break;case'go-report':openReport(0);break;case'go-portfolio':setPage('portfolio');break;case'portfolio-calendar':modal('Holdings calendar',HOLDINGS.slice(0,4).map(x=>`<div class="newsline"><b>${x[0]}</b><p>${x[4]}</p></div>`).join('')+'<p class="small">Illustrative events. Production dates must come from the existing event owner.</p>');break;case'manage-holdings':modal('Manage holdings',`<p>Use the incumbent Portfolio import and holdings editor. This design keeps review before any account write.</p><label class="small" for="sample-holding">Try an instrument</label><input id="sample-holding" class="inline-input mt8" placeholder="For example, NVDA"><p class="small">This field is local to the preview. No holdings are saved or imported.</p>`);break;case'bot-assumptions':modal('Paper account assumptions',`${fact('Account','Simulation only')}${fact('Execution','Recorded modelled fills')}${fact('Costs','Explicit fees and slippage')}${fact('Valuation','Recorded price source')}<p>Account history, fill assumptions, strategy version and original decisions must reconcile before performance is displayed. Illustrative values in this design do not prove a profitable strategy.</p>`);break;case'coverage':modal('Source coverage',`${fact('Selected view',PAGES.find(x=>x[0]===state.page)[1])}${fact('Preview state',state.quality)}<p>Only the affected source changes state. Missing values are not zero, stale data is not live, and available content remains usable.</p><p>Production reads must retain the source-specific time, coverage, correction and entitlement contract.</p>`);break;}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){setPage(p.dataset.page);return}const pp=e.target.closest('[data-picker-page]');if(pp){closeModal();setPage(pp.dataset.pickerPage);return}const s=e.target.closest('[data-set]');if(s){const k=s.dataset.set;if(k==='vaultSelected')state.vaultPassage=0;if(k==='earningsEvent')state.earningsClaim=0;state[k]=['botDecision','vaultSelected','earningsEvent','earningsClaim','forensic','memoryEpisode'].includes(k)?Number(s.dataset.value):s.dataset.value;render();return}const a=e.target.closest('[data-action]');if(a)action(a.dataset.action)});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();picker()}if(e.target.matches('g[role=button]')&&['Enter',' '].includes(e.key)){e.preventDefault();state[e.target.dataset.set]=e.target.dataset.value;render()}if(e.target.id==='vault-query'&&e.key==='Enter'){state.vaultQuery=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='vault-query'){state.vaultQuery=e.target.value}if(e.target.id==='workspace-query'){const q=e.target.value.toLowerCase();document.querySelectorAll('.page-option').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'flex':'none')}if(e.target.id==='reference-query'){const start=e.target.selectionStart;state.referenceQuery=e.target.value;render();const input=document.getElementById('reference-query');input.focus();input.setSelectionRange(start,start)}});
document.getElementById('state-control').addEventListener('change',e=>{state.quality=e.target.value;render()});document.getElementById('theme-control').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;render()});document.getElementById('notes-control').addEventListener('click',designNotes);document.getElementById('detail-dialog').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus()});window.addEventListener('popstate',e=>restoreNavigation(e.state));const initialReport=new URLSearchParams(location.search).get('report');if(state.page==='reports'&&initialReport!==null){state.reportOpen=true;state.reportIndex=Math.max(0,Math.min(3,Number(initialReport)||0))}if(!PAGES.some(x=>x[0]===state.page))state.page='hub';render();history.replaceState(navigationSnapshot(),'',location.href);
</script></body></html>
