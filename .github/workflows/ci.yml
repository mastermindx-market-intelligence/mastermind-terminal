name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  # merge-on-green refreshes stale branches with GITHUB_TOKEN. GitHub records
  # the refreshed head's pull_request run as held (action_required, no jobs),
  # and the controller re-runs that held run: it is the run the pull request's
  # required-check rollup reads (#874). Dispatching this workflow is only the
  # fallback for when no pull_request run appears for the refreshed head.
  workflow_dispatch:
    inputs:
      # On that fallback path the dispatched run may be the only CI run that has
      # executed for the sha (its checks alone do not satisfy the pull request's
      # rollup), so the migration-namespace guard has to be able to earn
      # PULL_REQUEST mode in it. github.event.pull_request.number does not exist on a dispatch, so the
      # controller passes the number it already knows (scripts/merge_on_green.py,
      # dispatch_ci). Optional: a hand-run dispatch that omits it stays LENIENT
      # and the guard's printed mode line says exactly that.
      pr_number:
        description: "Pull request number this run is proving (blank for a plain branch run)"
        type: string
        required: false
        default: ''

# Candidate code receives only the repository read authority needed by checkout.
# Privileged merge reconciliation remains isolated in merge-on-green.yml.
permissions:
  contents: read

# A newer head makes every queued/running proof for the older head unusable. Drop
# it immediately instead of spending the account-wide hosted-runner quota on a
# SHA that can no longer merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    name: Quote Hub tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hub/requirements-futures.txt
      - name: Futures offline SDK and source conformance
        run: |
          python -m pip install -r requirements-futures.txt
          python -m unittest discover -s tests -p 'test_futures_*.py' -v

  terminal-unit:
    name: Terminal unit + typecheck (shard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: terminal
    steps:
      # fetch-depth 2, not the default 1, exists for the plain-language guard's
      # enforce step at the end of this job. On a pull_request run HEAD is the
      # merge commit GitHub computed, and that step takes its base from HEAD^1
      # -- the merge commit's first parent -- which depth 1 does not fetch.
      # actions/checkout does the deepening itself, against the exact ref it
      # checks out (refs/pull/N/merge), so the parents come down with it. A
      # later `git fetch --deepen=1 origin` would not reliably do the same:
      # checkout leaves remote.origin.fetch pointing at refs/heads/*, and the
      # merge commit sits on no branch, so there is nothing there to deepen
      # along. Only this job pays for the extra commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      # next-env.d.ts and .next/ route types are gitignored; generate them first
      # so tsc checks the same project a `next build` would.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Quarantined journeys are disclosed on EVERY run: a green matrix must never be read as
      # full coverage. Bare `echo`, never a logger — a logger prefix pushes `::warning` off the
      # start of the line and GitHub silently drops the annotation.
      - name: Disclose quarantined e2e journeys
        run: |
          if [ ! -f e2e/QUARANTINE.md ]; then
            echo "::error title=e2e-quarantine::terminal/e2e/QUARANTINE.md is missing"
            exit 1
          fi
          awk -F'|' '/^## Observed but NOT quarantined/ { exit }
          /^\| *terminal\/e2e\// && NF == 8 {
            for (i = 1; i <= NF; i++) { gsub(/^[ \t]+|[ \t]+$/, "", $i) }
            print "::warning title=e2e-quarantine::" $2 " — " $3 " — owner: " $6 " — evidence: " $5 " — re-enable: " $7
            n++
          }
          END { print n+0 > "/tmp/quarantine_row_count.txt" }' e2e/QUARANTINE.md
          fixme_count=$(grep -rc "test\.fixme(" e2e | awk -F: '{s+=$2} END {print s+0}')
          row_count=$(cat /tmp/quarantine_row_count.txt 2>/dev/null || echo 0)
          if [ "$fixme_count" != "$row_count" ]; then
            echo "::error title=e2e-quarantine::terminal/e2e has $fixme_count test.fixme( occurrence(s) but QUARANTINE.md's quarantine table has $row_count row(s) — every quarantined test needs a disclosed row, and every row needs a live test.fixme"
            exit 1
          fi
      # The Chairman's plain-language law gets a Terminal-side enforcer here.
      # terminal/scripts/check_plain_language.mjs (packet B-PL-5) is a
      # forward-only guard, but until packet B-PLAT-B5-1 no job ran it: a PR
      # could put a raw state enum or an untranslated stat token in front of a
      # user and every required check still went green.
      #
      # These two steps run LAST in the job. The packet census permits this
      # placement -- "after npm test" -- and landing them after the
      # quarantine disclosure above specifically. That disclosure's comment
      # promises it runs on EVERY run, but it carries no `if: always()`; on
      # any run where the disclosure step itself executes, a guard step
      # placed before it would, the first time it found a blocking line, skip
      # the disclosure outright. Placing the guard last instead keeps that
      # promise intact wherever it already holds, rather than giving it a new
      # way to break.
      #
      # Step 1 proves the guard still works before anyone trusts its verdict.
      # Each rule is fed a fixture that violates it, through the same
      # scanLines() the real scan uses; a rule that no longer fires exits 2 and
      # turns this job red. A dead guard must never read as a clean tree.
      - name: Plain-language guard self-check
        run: node scripts/check_plain_language.mjs --self-check
      # Step 2 enforces, forward-only: a finding on a line THIS pull request
      # ADDED is blocking and fails the step, while the same finding on a
      # pre-existing line is printed as the legacy census and never turns a PR
      # red. An untouched legacy file cannot fail this step.
      #
      # WHICH COMMIT IS THE BASE is what makes that last sentence true or false.
      #
      # On `pull_request`, HEAD is the merge commit M that GitHub built when
      # this run was triggered: the branch merged into the base tip AS IT WAS
      # THEN. So the base must be M's FIRST PARENT, which is exactly that tip.
      # Re-fetching refs/heads/master at STEP time instead reads master AS IT
      # IS NOW, and master can advance while this job runs. Every line those
      # newer commits changed still stands in M in its older form, so
      # `git diff master@now M` emits it as an ADDED line -- and a legacy
      # finding in a file this PR never opened turns the check red. That is the
      # precise false red the forward-only promise exists to prevent. HEAD^1
      # cannot drift, because M is fixed; it resolves because this job's
      # checkout asks for fetch-depth 2.
      #
      # Off `pull_request` (the fallback workflow_dispatch run merge-on-green
      # fires on a refreshed branch, or a hand dispatch) there is no merge commit, so the base branch tip
      # is fetched explicitly -- a shallow checkout does not contain it, and
      # without the fetch $BASE cannot resolve at all. This step always passes
      # --diff-file (never --since), so an unresolved $BASE does not fail
      # open: `git diff --unified=0 "$BASE" HEAD` fails under
      # `set -euo pipefail` and the step dies loudly, having invoked the guard
      # on nothing. The fetch exists so $BASE resolves, not to avoid a silent
      # pass. Once it resolves, the diff is base tip vs HEAD, so the branch's
      # OWN changes count as added and can block, which is the point of
      # re-running the proof. A pre-existing line can only surface as added on
      # that path if the branch is BEHIND the base (git reads the branch's
      # older copy of a line the base has since changed as an addition). That
      # window is narrow on the merge-on-green path: the controller polls the
      # pull request until update-branch has written the new head and only
      # dispatches when no pull_request run appeared for it. A hand dispatch
      # can still race a behind branch. Failure direction stays false-red only.
      #
      # `set -euo pipefail` so the step fails CLOSED: an unresolvable HEAD^1
      # kills it loudly instead of leaving BASE empty and passing green.
      #
      # The diff is deliberately taken with TWO dots: `git diff A B` compares
      # two trees and needs no merge base, whereas a three-dot `A...B` needs
      # one, and two shallow histories give git nothing to find it in.
      #
      # BASE_REF is read from the environment rather than interpolated into
      # the shell text: a branch name is attacker-controllable. The pathspec is
      # written `:/terminal` (relative to the repo root) because this job's
      # steps run inside terminal/, and it is a superset of every path the
      # guard scans, so it cannot go stale against the guard's own globs.
      - name: Plain-language guard (forward-only, added lines block)
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE=$(git rev-parse HEAD^1)
          elif [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # The event freezes both trees. A later master must not turn an
            # untouched legacy line into a newly added line on this candidate.
            for SHA in "${MERGE_GROUP_BASE_SHA}" "${MERGE_GROUP_HEAD_SHA}"; do
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid merge-group commit identity" >&2; exit 1; }
            done
            [ "${MERGE_GROUP_BASE_REF}" = "refs/heads/${BASE_REF}" ] || { echo "Wrong merge-group base ref" >&2; exit 1; }
            case "${MERGE_GROUP_HEAD_REF}" in
              "refs/heads/gh-readonly-queue/${BASE_REF}/"?*) ;;
              *) echo "Invalid merge-group head ref" >&2; exit 1 ;;
            esac
            [ "${GITHUB_REF}" = "${MERGE_GROUP_HEAD_REF}" ] || { echo "Merge-group ref differs from checkout ref" >&2; exit 1; }
            [ "${GITHUB_SHA}" = "${MERGE_GROUP_HEAD_SHA}" ] || { echo "Merge-group SHA differs from workflow SHA" >&2; exit 1; }
            [ "$(git rev-parse HEAD)" = "${MERGE_GROUP_HEAD_SHA}" ] || { echo "Merge-group SHA differs from checked-out commit" >&2; exit 1; }
            BASE="${MERGE_GROUP_BASE_SHA}"
            # Fetch the exact object rather than resolving the moving branch.
            git fetch --no-tags --depth=1 origin "$BASE"
            [ "$(git rev-parse "${BASE}^{commit}")" = "$BASE" ] || { echo "Merge-group base is not the exact commit" >&2; exit 1; }
          else
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            BASE="refs/remotes/origin/${BASE_REF}"
          fi
          git diff --unified=0 "$BASE" HEAD -- ':/terminal' > "${RUNNER_TEMP}/plain-language.diff"
          node scripts/check_plain_language.mjs --mode enforce-added --diff-file "${RUNNER_TEMP}/plain-language.diff"

  terminal-e2e:
    name: Terminal e2e ${{ matrix.shard }} (shard)
    runs-on: ubuntu-latest
    # 6h default masked a 70-min job. Bound it. On 2026-10-04 the slowest shards measured
    # tablet ~35-36 min and each desktop half ~28-31 min (from the old whole-desktop runs).
    # By 2026-10-12 the whole tablet project ran 47-59 min and the whole mobile project
    # 44-56 min on green runs, and both were cancelled at the cap on slower runners
    # (#953, #954, #959, #960), so they were split into halves exactly like desktop.
    # On 2026-10-20 a mobile HALF still reached the unchanged cap (#1061): run
    # 39403170318, job 118563127930 started 09:48:07 UTC, selected 513 tests with
    # the single CI worker at 09:49:29, and was still passing with no assertion
    # failure when the host cancelled it at 10:48:24 (60m17s), so mobile runs in
    # thirds below.
    # This cap is a hang detector, not a budget to grow into: when a shard creeps toward it,
    # split that shard (as desktop, tablet and mobile are below), never just raise the number.
    timeout-minutes: 60
    strategy:
      # NEVER fail-fast. One red shard must not delete the other shards' evidence — the
      # aggregator below already turns any red into a red required check.
      fail-fast: false
      matrix:
        include:
          # Desktop first split after PR #677 reached the 60-minute cap. By 2026-10-18,
          # desktop-1 alone carried 415 tests and again reached the cap (run 39121850650),
          # so it ran in thirds. A THIRD still reached the unchanged cap on 2026-10-20
          # (#1090): run 39415184138, job 118602371043 started 11:28:26 UTC and was still
          # passing with no assertion failure when the host cancelled it at 12:28:40
          # (60m14s), while the run's other desktop, tablet, mobile, serial, unit and
          # ingest jobs finished green, so desktop ran in quarters. A QUARTER still
          # reached the unchanged cap on 2026-10-21: required run 39655439015,
          # job 119414325187 (desktop-1) reported a drawing recovery assertion at
          # 19:37:52 and seven subsequent passes at 19:39:49 before cancellation
          # at 19:45:28. That assertion has its own test-precondition repair;
          # partitioning preserves the hang cap and does not fix assertions. Green
          # predecessor heads 7579 (desktop-1 PASS 58m50) and 60c2 (PASS 57m17) sat
          # about a minute under the cap while every other quarter ran 26-44 min.
          # Five Playwright shards retain the complete project with less work per
          # runner. tests/test_ci_e2e_shards.py rejects missing, duplicate or
          # inconsistent shards.
          - shard: desktop-1
            projects: "--project=desktop --shard=1/5"
          - shard: desktop-2
            projects: "--project=desktop --shard=2/5"
          - shard: desktop-3
            projects: "--project=desktop --shard=3/5"
          - shard: desktop-4
            projects: "--project=desktop --shard=4/5"
          - shard: desktop-5
            projects: "--project=desktop --shard=5/5"
          # tablet and mobile outgrew one job the same way. On 2026-10-12 the last eight green
          # runs measured tablet 47-59 min and mobile 44-56 min, and train 3 (#960, head
          # 1dc6c48e9) lost both at the 60-min cap: jobs 114632507605 (tablet) and
          # 114632507580 (mobile) were cancelled after 60m17s with the orphan
          # `npm run test:e2e:responsive --project=tablet` process terminated and no test
          # failure (#954 and #959 heads lost tablet the same way). Same contiguous
          # `--shard` coverage contract as desktop; tests/test_ci_e2e_shards.py guards these too.
          # Tablet halves now approach the same cap: #1061 run 39416005343
          # tablet-1 passed in 56m47s, and #1090 run 39415184138 in 55m40s.
          # Three complete shards preserve coverage and leave runner margin.
          - shard: tablet-1
            projects: "--project=tablet --shard=1/3"
          - shard: tablet-2
            projects: "--project=tablet --shard=2/3"
          - shard: tablet-3
            projects: "--project=tablet --shard=3/3"
          # A mobile HALF still reached the cap: on 2026-10-20 run 39403170318
          # job 118563127930 started 09:48:07 UTC, selected 513 tests with the single CI
          # worker at 09:49:29, and was still passing with no assertion failure when the
          # host cancelled it at 10:48:24 — 60m17s, the unchanged cap (#1061). Three
          # contiguous Playwright shards, same coverage contract as desktop above.
          - shard: mobile-1
            projects: "--project=mobile --shard=1/3"
          - shard: mobile-2
            projects: "--project=mobile --shard=2/3"
          - shard: mobile-3
            projects: "--project=mobile --shard=3/3"
          # The company-intelligence chain uses Playwright `dependencies`
          # (playwright.config.ts:69-87) and MUST stay whole inside one shard, or the
          # dependency projects re-run in every shard that touches them.
          - shard: serial
            projects: >-
              --project=company-intelligence-desktop
              --project=company-intelligence-tablet
              --project=company-intelligence-mobile
              --project=terminal-chrome-intermediate
              --project=w2a-workspaces
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npx next typegen
      # Resolve the exact Playwright version so the browser cache key can never serve a
      # binary that does not match the client. A miss just reinstalls (23s) — never a false green.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--with-deps` shells out to apt, and the runner's Ubuntu mirror stalls often enough to
      # matter (see #438). Bound it, then fall back to a browser-only install.
      - name: Install Playwright browsers (apt bounded, browser-only fallback)
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          timeout 480 npx playwright install --with-deps chromium \
            || { echo "::warning::apt/--with-deps stalled or failed — installing the browser only"; \
                 npx playwright install chromium; }
      # A cache hit still needs the system libs check to be cheap and non-fatal.
      - name: Ensure browser present on cache hit
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - run: npm run test:e2e:responsive -- ${{ matrix.projects }}
      # This feature is default-off; the ordinary matrix skips its browser tests.
      # Exercise it with the SAME harness, without altering production flags.
      - name: Qualify investor shell opt-in
        if: matrix.shard == 'serial'
        env:
          MMX_INVESTOR_SHELL_PREVIEW: '1'
          CI: '1'
          TERMINAL_E2E_PORT: '31991'
        run: >-
          npm run test:e2e:responsive -- e2e/investor-shell-preview.spec.ts
          --project=desktop --project=tablet --project=mobile
          --workers=1 --retries=0
          --output=test-results/investor-shell-preview
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 HARD-FAILS on duplicate names across a matrix. The shard
          # suffix is mandatory, not cosmetic.
          name: responsive-qa-${{ github.run_id }}-${{ matrix.shard }}
          path: terminal/test-results
          if-no-files-found: ignore

  terminal:
    # FROZEN NAME. master's branch protection keys on this exact string. Do not edit it,
    # do not add a matrix to this job, do not let it become a `${{ }}` expression.
    name: Terminal typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [terminal-unit, terminal-e2e]
    # `always()` so a failed/cancelled/skipped dependency still REPORTS this check as red
    # rather than leaving it "expected — waiting" forever and wedging every armed PR.
    if: always()
    steps:
      - name: Assert every terminal shard succeeded
        env:
          UNIT: ${{ needs.terminal-unit.result }}
          E2E: ${{ needs.terminal-e2e.result }}
        run: |
          echo "terminal-unit=$UNIT terminal-e2e=$E2E"
          fail=0
          for pair in "terminal-unit:$UNIT" "terminal-e2e:$E2E"; do
            job=${pair%%:*}; res=${pair#*:}
            if [ "$res" != "success" ]; then
              echo "::error title=terminal-ci::$job concluded '$res' (expected 'success')"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All terminal shards green."

  python:
    name: Ingest + signal-layer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The MINIMAL import closure of tests/ + the ingest/signal_layer modules they pull in,
      # verified in a clean venv — the whole suite passes there with ZERO skips (a skip here
      # would mean a dependency is missing and a test is silently not running):
      #   numpy, pandas  — signal_layer.confluence / confluence_v2 and the tests directly
      #   pyarrow        — pandas' parquet engine, used by tests/test_golden_gate.py
      #   jsonschema     — tests/test_seasonal_regime.py. NOT optional: it is guarded by an
      #                    importorskip, so omitting it turns a real assertion into a silent
      #                    SKIP and the job goes green having tested nothing there.
      #   pyyaml         — tests/test_merge_on_green.py parses this very file's own YAML to
      #                    check the candidate-CI permission guard, so a raw text/regex match
      #                    can't misread a comment or a `run:` shell block as a real job key.
      # requirements.txt additionally carries fastapi/uvicorn, which nothing under tests/
      # imports — installing them would only slow the job down.
      - run: pip install numpy pandas pyarrow jsonschema pyyaml requests pytest
      # Run as `python -m pytest` from the repo root: that is what puts the root on sys.path,
      # which is how `import ingest.…` / `import signal_layer.…` resolve (there is no
      # conftest.py and no installed package).
      # PR_NUMBER is what lets the supabase/migrations namespace guard run its
      # pull-request rule (scripts/check_supabase_migration_namespace.py,
      # resolve_run_mode): on a PR branch a present .sql may carry an "open"
      # ledger row only for THIS pull request, and any other present+open row is
      # a stale ledger. Without it the guard's one enforcement rule is reachable
      # only from a push to master, which no workflow here triggers. It is a
      # number, not a credential, and it widens no authority: this step gains
      # exactly one environment variable and nothing else.
      # The `|| inputs.pr_number` half covers the fallback workflow_dispatch run
      # merge-on-green orders after refreshing a stale branch (round 4, MAJOR 2):
      # on that trigger github.event.pull_request.number is empty, and that
      # dispatched run is then the only CI run for the sha that merges.
      - run: python -m pytest tests/ -q
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          # Read-only native membership qualification for present open migrations
          # on a single-entry merge group. No PR/contents write permission added.
          GH_TOKEN: ${{ github.event_name == 'merge_group' && github.token || '' }}

  investigation-postgres:
    name: Investigation PostgreSQL invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          python -m pip install pytest==8.3.5
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Require PostgreSQL rather than silently skip
        run: |
          command -v initdb
          command -v pg_ctl
          command -v psql
      - name: Exercise migration, replay, CAS and owner isolation
        run: python -m pytest tests/test_investigation_postgres.py tests/test_thesis_proposal_postgres.py tests/test_api_watchlist_write_postgres.py tests/test_forex_watch_postgres.py -q
      - name: Exercise drawing snapshots, replacement and actual competing sessions
        run: python tests/sql/audit04/run_native_fixture.py --out-dir "$RUNNER_TEMP/audit04-evidence"
