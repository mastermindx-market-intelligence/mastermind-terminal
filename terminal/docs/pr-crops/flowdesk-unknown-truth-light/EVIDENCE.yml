# capturedAtHead is informational. The lock is layoutFiles.
# #1198 G8 moved the FlowDeskView.tsx and WatchlistRail.tsx pins only; no crop was recaptured. Same-host fixed-clock A/B (2-3 renders with the G8 files, 2-6 with the pre-G8 files): gauge-empty-390-toolbar and gauge-partial-1440-context render the same non-committed bytes under both sources (source-independent: G8 and pre-G8 give identical bytes; cause not established, not bisected); unavailable-1440-context differs only inside its as-of text (clock); absent-after-data-1440-{context,note,zh-context,zh-note}, absent-first-1440-{context,toolbar,zh-context,zh-toolbar}, gauge-empty-1440-{context,toolbar,zh-context,zh-toolbar} and na-score-1440-{context,zh-context} vary run to run (rounded-corner anti-aliasing); every crop shares at least one byte-identical render between the two sources.
