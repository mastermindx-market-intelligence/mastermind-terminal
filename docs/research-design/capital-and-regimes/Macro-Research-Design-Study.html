const sliders='<div class="filters"><label class="dateinput">Start <input aria-label="Window start day" type="range" min="273" max="301" value="'+start+'" onchange="set(\'start\',this.value)"></label><label class="dateinput">End <input aria-label="Window end day" type="range" min="325" max="357" value="'+end+'" onchange="set(\'end\',this.value)"></label></div>';
return hero('SPY · S&P 500 ETF',dt(start)+' – '+dt(end),up+' of 25 complete years finished higher. The median move was '+signed(median,1)+'%.','',tag(def?'Published window':'Exploratory window'))+'<div class="grid">'+panel('Window returns',chart+'<div class="chartcap"><span><i class="key"></i>Median</span><span><i class="key gold"></i>'+yr+'</span><span><i class="key grey"></i>Individual years</span></div><div class="rule"></div>'+sliders,select)+panel('Selected year','<p class="eyebrow">'+yr+' return</p><div class="big">'+signed(returns.find(r=>r.year===yr).last,2)+'%</div>'+row('Up years',up+' / 25')+row('Sample median',signed(median,1)+'%')+row('Nearby-date test',def?'Sensitive':'Unscored')+action('Inspect window evidence','seamethod'))+'</div>'+annualField(start,end,yr)}
function roster(){const phases=['All',...new Set(data.roster.map(a=>a.phase))];const f=find(s('phase','All'),phases,'All');const matches=data.roster.filter(a=>f==='All'||a.phase===f);const ctl='<label class="dateinput">Phase <select class="select" id="phaseSelect" onchange="set(\'phase\',this.value)">'+phases.map(p=>'<option '+(p===f?'selected':'')+'>'+esc(p)+'</option>').join('')+'</select></label>';return '<details class="disclosure" '+(s('phase','All')!=='All'?'open':'')+'><summary>All 23 cycles</summary>'+panel('Cycle roster','<div class="meta">'+matches.length+' of 23 cycles</div><table class="data-table"><thead><tr><th>Cycle</th><th>Phase or basis</th><th>Reading</th></tr></thead><tbody>'+matches.map(a=>{const id='roster-'+a.id;note(id,a.name,row('Basis',titleCase(a.tier))+row('Reading',a.last)+row('Phase or frame',a.phase));return '<tr><td><button data-detail="'+id+'">'+esc(a.name)+'</button></td><td>'+esc(a.phase)+'</td><td>'+esc(a.last)+'</td></tr>'}).join('')+'</tbody></table>',ctl)+'</details>'}
function annualField(start,end,yr){const years=data.yearfield;const bound=Math.ceil(Math.max(...years.flatMap(r=>r.path.map(Math.abs)))/10)*10;const X=i=>43+557*i/(years[0].path.length-1),Y=v=>89-v/bound*74;const d=ys=>ys.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');const lo=43+(start-1)/364*557,hi=43+(end-1)/364*557;return '<details class="disclosure"><summary>Full-year context</summary><section class="panel"><div class="panelhead"><h2>Annual return paths</h2>'+tag('SPY · 2001–2025')+'</div><div class="pad"><svg class="plot" viewBox="0 0 620 195" role="img" aria-label="25 historical annual paths sampled weekly, measured from the start of each year. Shaded dates are the selected window."><rect x="'+lo+'" y="12" width="'+(hi-lo)+'" height="152" fill="var(--linkbg)"/><path d="M43 89h557" stroke="var(--muted)" stroke-dasharray="4 4"/>'+[-bound,0,bound].map(v=>'<text x="35" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'%</text>').join('')+years.map(r=>'<path d="'+d(r.path)+'" fill="none" stroke="var(--dot)" stroke-width="1" opacity=".6"/>').join('')+'<path d="'+d(years.find(v=>v.year===yr).path)+'" stroke="var(--gold)" fill="none" stroke-width="2"/>'+['Jan','Apr','Jul','Oct','Dec'].map((m,i)=>'<text x="'+[43,181,320,460,600][i]+'" y="188" text-anchor="'+(i===4?'end':i===0?'start':'middle')+'">'+m+'</text>').join('')+'</svg><div class="chartcap"><span><i class="key gold"></i>'+yr+'</span><span>Each year starts at zero · weekly samples</span></div></div></section></details>'}

function render(){let previous=document.activeElement;const hadFocus=previous&&previous!==document.body;const fb=hadFocus?{key:previous.dataset?.set,val:previous.dataset?.val,aria:previous.getAttribute('aria-label'),id:previous.id}:null;
details.clear();const {page}=getState();let n=el('nav');n.innerHTML='<h2>Research</h2>'+[[groupA,'Capital & regimes'],[groupB,'Find the edge']].map(([g,name])=>'<div class="group">'+name+'</div>'+g.map(k=>'<button class="nav" onclick="go(\''+k+'\')" '+(page===k?'aria-current="page"':'')+'>'+icon(routes[k][1])+routes[k][0]+'</button>').join('')).join('')+'<div class="sidefoot">Design study · archived examples</div>';el('menuButton').innerHTML=icon('menu');el('themeBtn').innerHTML=icon('sun');const pages={wti,cycle,weather,smart,funds,signal,radar,season};el('main').innerHTML='<div class="breadcrumb">Research <span>/</span> '+labels[page][0]+'</div><div class="intro"><h1>'+routes[page][0]+'</h1>'+stamp(labels[page][1])+'</div>'+pages[page]();document.title=routes[page][0]+' · Mastermind design study';if(fb){let replacement=fb.key?[...document.querySelectorAll('[data-set]')].find(e=>e.dataset.set===fb.key&&e.dataset.val===fb.val):fb.id?el(fb.id):fb.aria?[...document.querySelectorAll('[aria-label]')].find(e=>e.getAttribute('aria-label')===fb.aria):null;if(replacement)replacement.focus({preventScroll:true})}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-detail],[data-set]');if(!b)return;if(b.dataset.detail)openDetail(b.dataset.detail);else set(b.dataset.set,b.dataset.val)});
el('detail').addEventListener('click',e=>{if(e.target===el('detail')){const r=el('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)el('detail').close()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el('nav').classList.contains('open')&&!el('detail').open){menuToggle();el('menuButton').focus()}});
let lastPage=getState().page;window.addEventListener('hashchange',()=>{const changed=getState().page!==lastPage;lastPage=getState().page;render();if(changed){window.scrollTo(0,0);el('main').focus({preventScroll:true})}});render();
</script></body></html>
