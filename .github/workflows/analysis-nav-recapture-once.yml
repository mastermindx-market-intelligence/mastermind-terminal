# Transient, branch-scoped reproduction of existing visual evidence locks.
# The completed capture commit removes this workflow; no recurring automation.
name: Analysis Navigation - One-Shot Evidence Recapture
on:
  push:
    branches:
      - sol/analysis-nav-unified-20261017
    paths:
      - .github/workflows/analysis-nav-recapture-once.yml
permissions:
  contents: write
concurrency:
  group: analysis-nav-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.repository == 'mastermindx-market-intelligence/mastermind-terminal' && github.ref == 'refs/heads/sol/analysis-nav-unified-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for fixture-browser capture
        run: |
          timeout 480 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Refresh Analysis Workspace crops without touching unrelated historical surfaces
        env:
          CAPTURE_ONLY: AnalysisWorkspace
          TERMINAL_CROP_PORT: '3536'
        run: node e2e/tools/capture_pl6_batch1.cjs
      - name: Refresh Theses entry desktop tablet and mobile EN/ZH evidence
        env:
          TERMINAL_CROP_PORT: '3565'
        run: node e2e/tools/capture_b_f11_10_analysis_theses_entry.cjs
      - name: Verify all ten required captures are present
        run: |
          set -eu
          for f in AnalysisWorkspace-1440.png AnalysisWorkspace-1440-zh.png AnalysisWorkspace-390.png AnalysisWorkspace-390-zh.png; do
            test -s "docs/pr-crops/b-pl-6-batch-1/$f"
          done
          for f in desktop-en.png desktop-zh.png tablet-en.png tablet-zh.png mobile-en.png mobile-zh.png; do
            test -s "docs/pr-crops/b-f11-10-analysis-theses-entry/$f"
          done
          test -s docs/pr-crops/b-pl-6-batch-1/EVIDENCE.yml
          test -s docs/pr-crops/b-f11-10-analysis-theses-entry/EVIDENCE.yml
      - name: Commit captured evidence and self-remove one-shot capture workflow
        working-directory: .
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add terminal/docs/pr-crops/b-pl-6-batch-1/EVIDENCE.yml
          git add terminal/docs/pr-crops/b-pl-6-batch-1/AnalysisWorkspace-1440.png
          git add terminal/docs/pr-crops/b-pl-6-batch-1/AnalysisWorkspace-1440-zh.png
          git add terminal/docs/pr-crops/b-pl-6-batch-1/AnalysisWorkspace-390.png
          git add terminal/docs/pr-crops/b-pl-6-batch-1/AnalysisWorkspace-390-zh.png
          git add terminal/docs/pr-crops/b-f11-10-analysis-theses-entry/EVIDENCE.yml
          git add terminal/docs/pr-crops/b-f11-10-analysis-theses-entry/*.png
          git rm .github/workflows/analysis-nav-recapture-once.yml
          git diff --cached --check
          git commit -m 'test(analysis): recapture ten browser crops and lock updated header layout'
          git push origin HEAD:refs/heads/sol/analysis-nav-unified-20261017
