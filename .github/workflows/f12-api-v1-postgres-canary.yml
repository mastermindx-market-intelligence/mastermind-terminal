name: f12-api-v1-postgres-canary

on:
  pull_request:
    paths:
      - "supabase/migrations/0027_api_keys.sql"
      - "terminal/scripts/f12_api_v1_postgres_canary.py"
      - ".github/workflows/f12-api-v1-postgres-canary.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg[binary]
      - run: python3 terminal/scripts/f12_api_v1_postgres_canary.py --migrations supabase/migrations --receipt f12-api-v1-postgres-canary-receipt.json
        env:
          F12_API_V1_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          F12_API_V1_EXPECTED_COMMIT: ${{ github.sha }}
          F12_API_V1_GITHUB_RUN_ID: ${{ github.run_id }}
          F12_API_V1_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          F12_API_V1_GITHUB_JOB: ${{ github.job }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f12-api-v1-postgres-canary-receipt
          path: f12-api-v1-postgres-canary-receipt.json
