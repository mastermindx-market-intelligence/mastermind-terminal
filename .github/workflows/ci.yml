name: CI

on:
  pull_request:
  # merge-on-green refreshes stale branches with GITHUB_TOKEN. Those writes do
  # not recursively emit pull_request workflows, so the controller dispatches
  # this same proof explicitly on the refreshed branch.
  workflow_dispatch:

# Candidate code receives only the repository read authority needed by checkout.
# Privileged merge reconciliation remains isolated in merge-on-green.yml.
permissions:
  contents: read

# A newer head makes every queued/running proof for the older head unusable. Drop
# it immediately instead of spending the account-wide hosted-runner quota on a
# SHA that can no longer merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    name: Quote Hub tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm test

  terminal-unit:
    name: Terminal unit + typecheck (shard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      # next-env.d.ts and .next/ route types are gitignored; generate them first
      # so tsc checks the same project a `next build` would.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Quarantined journeys are disclosed on EVERY run: a green matrix must never be read as
      # full coverage. Bare `echo`, never a logger — a logger prefix pushes `::warning` off the
      # start of the line and GitHub silently drops the annotation.
      - name: Disclose quarantined e2e journeys
        run: |
          if [ ! -f e2e/QUARANTINE.md ]; then
            echo "::error title=e2e-quarantine::terminal/e2e/QUARANTINE.md is missing"
            exit 1
          fi
          awk -F'|' '/^## Observed but NOT quarantined/ { exit }
          /^\| *terminal\/e2e\// && NF == 8 {
            for (i = 1; i <= NF; i++) { gsub(/^[ \t]+|[ \t]+$/, "", $i) }
            print "::warning title=e2e-quarantine::" $2 " — " $3 " — owner: " $6 " — evidence: " $5 " — re-enable: " $7
            n++
          }
          END { print n+0 > "/tmp/quarantine_row_count.txt" }' e2e/QUARANTINE.md
          fixme_count=$(grep -rc "test\.fixme(" e2e | awk -F: '{s+=$2} END {print s+0}')
          row_count=$(cat /tmp/quarantine_row_count.txt 2>/dev/null || echo 0)
          if [ "$fixme_count" != "$row_count" ]; then
            echo "::error title=e2e-quarantine::terminal/e2e has $fixme_count test.fixme( occurrence(s) but QUARANTINE.md's quarantine table has $row_count row(s) — every quarantined test needs a disclosed row, and every row needs a live test.fixme"
            exit 1
          fi

  terminal-e2e:
    name: Terminal e2e ${{ matrix.shard }} (shard)
    runs-on: ubuntu-latest
    # 6h default masked a 70-min job. Bound it: the slowest shard measured ~24 min.
    timeout-minutes: 60
    strategy:
      # NEVER fail-fast. One red shard must not delete the other shards' evidence — the
      # aggregator below already turns any red into a red required check.
      fail-fast: false
      matrix:
        include:
          - shard: desktop
            projects: "--project=desktop"
          - shard: tablet
            projects: "--project=tablet"
          - shard: mobile
            projects: "--project=mobile"
          # The company-intelligence chain uses Playwright `dependencies`
          # (playwright.config.ts:69-87) and MUST stay whole inside one shard, or the
          # dependency projects re-run in every shard that touches them.
          - shard: serial
            projects: >-
              --project=company-intelligence-desktop
              --project=company-intelligence-tablet
              --project=company-intelligence-mobile
              --project=terminal-chrome-intermediate
              --project=w2a-workspaces
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npx next typegen
      # Resolve the exact Playwright version so the browser cache key can never serve a
      # binary that does not match the client. A miss just reinstalls (23s) — never a false green.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--with-deps` shells out to apt, and the runner's Ubuntu mirror stalls often enough to
      # matter (see #438). Bound it, then fall back to a browser-only install.
      - name: Install Playwright browsers (apt bounded, browser-only fallback)
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          timeout 480 npx playwright install --with-deps chromium \
            || { echo "::warning::apt/--with-deps stalled or failed — installing the browser only"; \
                 npx playwright install chromium; }
      # A cache hit still needs the system libs check to be cheap and non-fatal.
      - name: Ensure browser present on cache hit
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - run: npm run test:e2e:responsive -- ${{ matrix.projects }}
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 HARD-FAILS on duplicate names across a matrix. The shard
          # suffix is mandatory, not cosmetic.
          name: responsive-qa-${{ github.run_id }}-${{ matrix.shard }}
          path: terminal/test-results
          if-no-files-found: ignore

  terminal:
    # FROZEN NAME. master's branch protection keys on this exact string. Do not edit it,
    # do not add a matrix to this job, do not let it become a `${{ }}` expression.
    name: Terminal typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [terminal-unit, terminal-e2e]
    # `always()` so a failed/cancelled/skipped dependency still REPORTS this check as red
    # rather than leaving it "expected — waiting" forever and wedging every armed PR.
    if: always()
    steps:
      - name: Assert every terminal shard succeeded
        env:
          UNIT: ${{ needs.terminal-unit.result }}
          E2E: ${{ needs.terminal-e2e.result }}
        run: |
          echo "terminal-unit=$UNIT terminal-e2e=$E2E"
          fail=0
          for pair in "terminal-unit:$UNIT" "terminal-e2e:$E2E"; do
            job=${pair%%:*}; res=${pair#*:}
            if [ "$res" != "success" ]; then
              echo "::error title=terminal-ci::$job concluded '$res' (expected 'success')"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All terminal shards green."

  python:
    name: Ingest + signal-layer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The MINIMAL import closure of tests/ + the ingest/signal_layer modules they pull in,
      # verified in a clean venv — the whole suite passes there with ZERO skips (a skip here
      # would mean a dependency is missing and a test is silently not running):
      #   numpy, pandas  — signal_layer.confluence / confluence_v2 and the tests directly
      #   pyarrow        — pandas' parquet engine, used by tests/test_golden_gate.py
      #   jsonschema     — tests/test_seasonal_regime.py. NOT optional: it is guarded by an
      #                    importorskip, so omitting it turns a real assertion into a silent
      #                    SKIP and the job goes green having tested nothing there.
      #   pyyaml         — tests/test_merge_on_green.py parses this very file's own YAML to
      #                    check the candidate-CI permission guard, so a raw text/regex match
      #                    can't misread a comment or a `run:` shell block as a real job key.
      # requirements.txt additionally carries fastapi/uvicorn, which nothing under tests/
      # imports — installing them would only slow the job down.
      - run: pip install numpy pandas pyarrow jsonschema pyyaml pytest
      # Run as `python -m pytest` from the repo root: that is what puts the root on sys.path,
      # which is how `import ingest.…` / `import signal_layer.…` resolve (there is no
      # conftest.py and no installed package).
      - run: python -m pytest tests/ -q
