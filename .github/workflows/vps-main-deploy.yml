name: vps-main-deploy
# Fast wake after a protected Terminal master update. No PR-head execution,
# direct worktree sync or parallel publisher: the existing exact-source
# terminal-build.sh owns preflight, build lock, atomic swap and rollback.
# An already active/enabled beta follows through that SAME owner; stopped beta is untouched.
on:
  push:
    branches: [master]
    paths:
      - "terminal/**"
      - "ingest/**"
      - "signal_layer/**"
      - "scripts/**"
      - "config/**"
      - "contracts/**"
      - "hub/**"
      - "ops/terminal-build.sh"
      - "ops/terminal-data"
      - ".github/workflows/vps-main-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Keep the actively building generation alive. GitHub may coalesce stale
# pending wake-ups; the next accepted wake deploys the latest protected master.
concurrency:
  group: terminal-vps-main-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'mastermindx-market-intelligence/mastermind-terminal' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Read pinned accepted source and host identity
        uses: actions/checkout@v4
        with:
          sparse-checkout: ops/vps_origin_known_hosts
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Invoke existing exact-commit builder and refresh an active beta
        shell: bash
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VPS_DEPLOY_KEY" ] || { echo "::error::VPS_DEPLOY_KEY not configured in this repository"; exit 1; }
          PIN="$GITHUB_WORKSPACE/ops/vps_origin_known_hosts"
          [ -s "$PIN" ] || { echo "::error::VPS host pin missing"; exit 1; }
          grep -qx '146.190.142.17 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEc8ibhWOj35RC4FXjydG27GMxKfjiVXOw0s7hiCySkk' "$PIN" ||
            { echo "::error::VPS host pin mismatch"; exit 1; }

          # Deploy the CURRENT protected master to absorb coalesced main pushes;
          # never interpret the original event SHA as a release target after it
          # has been superseded. The incumbent builder independently fetches and
          # verifies that this exact SHA belongs to its protected origin/master.
          TARGET_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::Could not pin current protected master"; exit 1; }
          echo "::notice::Terminal target is protected master $TARGET_SHA"

          umask 077
          KEYFILE="$(mktemp "$RUNNER_TEMP/terminal-vps-key.XXXXXX")"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$KEYFILE"

          # The remote owner validates full Git history, the CLEAN source
          # preflight, activation profile and the production .deployment-id.
          ssh -F /dev/null -i "$KEYFILE" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$PIN" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=15 \
            root@146.190.142.17 \
            bash -s -- "$TARGET_SHA" <<'MMX_RELEASE_SCRIPT'
          set -eu
          target_sha="$1"
          test -r /opt/terminal/terminal-build.sh
          # Bootstrap deadlock break (CI Lightning F2): the installed
          # /opt/terminal/terminal-build.sh only self-updates at the END of a
          # successful build, so a first deploy after a builder-side admission
          # change can never run the current protected logic. Stage the
          # builder bytes FROM TARGET_SHA out of the host's existing
          # /opt/terminal/.gitsrc mirror, verify the fetch landed exactly the
          # protected target and the staged bytes hash to the target's
          # ops/terminal-build.sh blob, then invoke THE STAGED COPY. The
          # builder's own self-install step still refreshes the canonical
          # installed path for subsequent runs. Staged file: root-owned 0700
          # mktemp path, removed on any exit.
          git -C /opt/terminal/.gitsrc fetch --no-tags origin master
          fetched_head="$(git -C /opt/terminal/.gitsrc rev-parse FETCH_HEAD)"
          test "$fetched_head" = "$target_sha" || {
            printf 'Refusing deploy: .gitsrc FETCH_HEAD %s is not protected target %s\n' "$fetched_head" "$target_sha" >&2
            exit 1
          }
          staged="$(mktemp)"
          chmod 0700 "$staged"
          trap 'rm -f "$staged"' EXIT
          git -C /opt/terminal/.gitsrc show "${target_sha}:ops/terminal-build.sh" > "$staged"
          staged_blob="$(git -C /opt/terminal/.gitsrc hash-object "$staged")"
          target_blob="$(git -C /opt/terminal/.gitsrc rev-parse "${target_sha}:ops/terminal-build.sh")"
          test "$staged_blob" = "$target_blob" || {
            printf 'Refusing deploy: staged builder blob %s != protected target blob %s\n' "$staged_blob" "$target_blob" >&2
            exit 1
          }
          bash "$staged" --target production --target-sha "$target_sha"
          installed="$(cat /opt/terminal/terminal/.deployment-id)"
          test "$installed" = "$target_sha"
          printf 'Verified Terminal production marker: %s\n' "$installed"
          if systemctl is-active --quiet terminal-beta.service && systemctl is-enabled --quiet terminal-beta.service; then
            test -L /opt/terminal/beta/.runtime-accepted
            bash "$staged" --target beta --target-sha "$target_sha"
            python3 -c 'import json,sys,urllib.request; receipt=json.load(open(sys.argv[1])); status=json.load(urllib.request.urlopen("http://127.0.0.1:3001/api/shared-shell/status",timeout=15)); ok=receipt.get("accepted_sha")==sys.argv[2] and status.get("buildId")==sys.argv[2] and status.get("enabled") is True; print("Verified Terminal beta receipt and origin:" if ok else "Beta receipt/origin did not qualify:",sys.argv[2]); sys.exit(0 if ok else 1)' /opt/terminal/beta/.runtime-accepted "$target_sha"
          else
            printf 'Beta is not both active and enabled; existing stop/start policy preserved.\n'
          fi
          MMX_RELEASE_SCRIPT
