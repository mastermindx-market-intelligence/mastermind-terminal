injection: page.route on **/api/drawings answers every GET 500, so drawingsReadyFor(NVDA) stays false and activateDrawingTool refuses
capture_flag: TERMINAL_E2E_FIXTURE
capture_flag_law: next.config.ts sets devIndicators to false when TERMINAL_E2E_FIXTURE is set.
