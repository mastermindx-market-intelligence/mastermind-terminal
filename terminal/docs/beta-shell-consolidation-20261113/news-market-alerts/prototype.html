function toggleDesk(d){change({...base,caseId:'',desk:d,view:d==='news'?'briefing':'now',theme:st.theme});}
function dismiss(focus=true){const prev=dialogTrigger;$('#modal').innerHTML='';dialog='';$('#app').inert=false;if(prev&&focus)prev.focus({preventScroll:true})}
function menu(name){dialogTrigger=document.activeElement;dialog=name;let h,body;const actions=(save,word)=>'<div class="actions">'+B('Cancel','dismiss')+B(word,save,'primary')+'</div>';
if(name==='desks'){h='Open a desk';body='<div class="shelf mt">'+B('News Intelligence','desk:news','ctl','news')+B('Market Alerts','desk:alerts','ctl','pulse')+'</div>'}
if(name==='filters'){h='Filter '+(isNews()?'stories':'observations');let opts=isNews()?['All','Companies','Supply chains','Energy','Rates']:['All','Macro','Commodities','Companies'];body='<label class="field">Subject<select id="topic">'+opts.map(x=>'<option '+(x===st.topic?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+actions('apply','Apply filters')}
if(name==='follow'){h='Follow topics';draftTopics=[...selectedTopics];body=['Companies','Supply chains','Energy','Rates'].map(x=>'<label class="check"><input type="checkbox" value="'+x+'" '+(draftTopics.includes(x)?'checked':'')+'> '+x+'</label>').join('')+actions('applyfollow','Save topics')}
if(name==='investigate'){h='Add to investigation';body='<p class="sub">Keep a reference to the version you reviewed in this browser.</p><label class="field">Investigation<select id="casePick"><option value="new">New investigation</option>'+dossiers.map(d=>'<option value="'+safe(d.id)+'">'+safe(d.title)+'</option>').join('')+'</select></label><label class="field" id="caseLabel">Investigation name<input id="caseName" maxlength="80" placeholder="e.g. Contract terms"></label>'+actions('addcase','Add reference')}
if(name==='saveview'){h='Save this view';body='<p class="sub">Keep this search and its subject filter in this browser.</p><label class="field">View name<input id="viewName" maxlength="80" placeholder="e.g. Supply chain updates"></label>'+actions('addview','Save view')}
if(name==='coverage'){h='Source coverage';body=notice(st.state==='partial'?'Partial coverage':'All expected sources reported',st.state==='partial'?'The Macro Vector dependency is unavailable. Other rows can still be inspected.':'The retained publication reports complete coverage for the board day.')+table([['Board date','Nov 14, 2026'],['Publication','10:24 UTC'],['Source observation dates','Vary by signal']]);}
if(name==='scenes'){h='Design preview';body='<p class="sub">News uses a fictional edition. Market Alerts uses four selected observations from the retained November 14 publication. Coverage failures and current-source destinations are simulated.</p><label class="field">Desk<select id="demoDesk"><option value="news">News Intelligence</option><option value="alerts">Market Alerts</option></select></label><label class="field">Scenario<select id="demoState"></select></label>'+actions('scenario','Open scenario')}
$('#modal').innerHTML='<div class="dialogWrap"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="headingRow"><h2 id="dialogTitle">'+h+'</h2>'+B('','dismiss','iconBtn','x','aria-label="Close dialog"')+'</div>'+body+'</section></div>';$('#app').inert=true;
if(name==='investigate'){const c=$('#casePick');c.onchange=()=>{$('#caseLabel').hidden=c.value!=='new'}}
if(name==='scenes'){let sel=$('#demoDesk');sel.value=st.desk;function options(){const common=[['normal','Opening view'],['partial','Partial coverage'],['stale','Delayed refresh'],['loading','Loading'],['unavailable','Unavailable'],['denied','Access required']];const n=[['reader','Correction reader'],['compare','Compare reporting origins'],['basis','Saved original revision'],['arrivals','Buffered arrivals'],['withdrawn','Withdrawn report']];const a=[['inspector','Regime evidence'],['copper','Copper recurrence'],['rank','Attention priority'],['quiet','Healthy, quiet edition']];$('#demoState').innerHTML=[...common,...(sel.value==='news'?n:a)].map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join('')}sel.onchange=options;options()}
$('#modal button, #modal input, #modal select')?.focus()}
function scenario(d,s){dismiss(false);let u={...base,desk:d,view:d==='news'?'briefing':'now',theme:st.theme,state:s};if(d==='news'){if(['reader','compare','basis'].includes(s)){u.item='contract';u.state='normal';u.tab=s==='compare'?'sources':s==='basis'?'revisions':'evidence';if(s==='basis'){saved.contract={rev:1};saveRefs()}}if(s==='arrivals'){arrived=false;u.view='stream'}}else if(['inspector','copper','rank'].includes(s)){u.state='normal';u.item=s==='copper'?'copper':'regime';u.tab=s==='copper'?'history':s==='rank'?'rank':'evidence'}change(u)}
function doAction(a,el){const [k,v]=a.split(':');if(['desks','filters','follow','scenes','coverage','investigate','saveview'].includes(k)){menu(k);return}if(k==='dismiss'){dismiss();return}if(k==='desk'){if(dialog)dismiss(false);toggleDesk(v);return}if(k==='scenario'){scenario($('#demoDesk').value,$('#demoState').value);return}
if(k==='addcase'){const pick=$('#casePick').value;let c=dossiers.find(x=>x.id===pick);if(!c){const name=$('#caseName').value.trim();if(!name){$('#caseName').setCustomValidity('Enter an investigation name');$('#caseName').reportValidity();$('#caseName').oninput=()=>$('#caseName').setCustomValidity('');return}c={id:'case-'+Date.now(),title:name,refs:[]};dossiers.push(c)}if(!c.refs.some(x=>x.id===st.item&&x.rev===(st.item==='contract'?2:1)))c.refs.push({id:st.item,rev:st.item==='contract'?2:1});persist('mmx-design-cases',dossiers);dismiss(false);change({item:'',source:'',view:'saved',caseId:c.id});return}
if(k==='addview'){const title=$('#viewName').value.trim();if(!title){$('#viewName').setCustomValidity('Enter a view name');$('#viewName').reportValidity();$('#viewName').oninput=()=>$('#viewName').setCustomValidity('');return}savedViews=savedViews.filter(v=>v.title!==title).concat({title,topic:st.topic,q:st.q});persist('mmx-design-views',savedViews);dismiss(false);change({view:'saved',caseId:''});return}
if(k==='restoreview'){const t=savedViews[Number(v)];if(t)change({view:'stream',q:t.q,topic:t.topic});return}
if(k==='case'){change({view:'saved',caseId:v});return}if(k==='casesback'){change({view:'saved',caseId:''});return}
if(k==='apply'){let topic=$('#topic').value;dismiss(false);change({topic,item:'',source:'',view:isNews()?'stream':'explore'});return}
if(k==='applyfollow'){selectedTopics=[...document.querySelectorAll('#modal input:checked')].map(e=>e.value);persist('mmx-design-follow',selectedTopics);dismiss(false);change({view:'following',item:''});return}
if(k==='item'){anchor=window.scrollY;returnFocus=el?.id||'';if(!returnFocus&&el){el.id='lead-focus';returnFocus='lead-focus'}change({item:v,tab:'evidence',source:''});return}
if(k==='tab'){change({tab:v},'main');return}if(k==='back'){change({item:'',source:'',tab:'evidence'},null);window.scrollTo(0,anchor);let trg=document.getElementById(returnFocus)||document.querySelector('[data-a="item:'+ (isNews()?'contract':'regime')+'"]');(trg||$('#main')).focus({preventScroll:true});return}
if(k==='view'){change({view:v,item:'',caseId:'',source:'',tab:'evidence'});return}if(k==='source'){sourceFocus=v;change({source:v,backTab:st.tab});return}if(k==='sourceback'){change({source:'',tab:st.backTab},null);Array.from(document.querySelectorAll('[data-a^="source:"]')).find(n=>n.dataset.a==='source:'+sourceFocus)?.focus({preventScroll:true});return}
if(k==='search'){change({item:'',view:isNews()?'stream':'explore'},'query');return}if(k==='topic'){change({item:'',topic:v,view:'stream'});return}if(k==='clear'){change({q:'',topic:'All'});return}
if(k==='arrivals'){const first=document.querySelector('.row');const y=first?.getBoundingClientRect().top;arrived=true;render();const same=first?.id&&document.getElementById(first.id);if(y!=null&&same)window.scrollBy(0,same.getBoundingClientRect().top-y);$('#announce').textContent='Two stories added. Earlier stories remain in the stream.';$('#main').focus({preventScroll:true});return}
if(k==='save'){if(saved[st.item])delete saved[st.item];else saved[st.item]={rev:st.item==='contract'?2:1};saveRefs();render();document.querySelector('[data-a="save"]')?.focus({preventScroll:true});$('#announce').textContent=saved[st.item]?'Reference saved in this browser':'Reference removed';return}
if(k==='archive'){change({state:'normal',view:'history'});return}if(k==='retry'){change({state:'normal'});return}if(k==='theme'){change({theme:st.theme==='dark'?'light':'dark'},null,true);document.querySelector('[data-a="theme"]').focus({preventScroll:true});return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(b)doAction(b.dataset.a,b);else if(e.target.classList.contains('dialogWrap'))dismiss()});document.addEventListener('keydown',e=>{if(dialog){if(e.key==='Escape')dismiss();if(e.key==='Tab'){let f=[...document.querySelectorAll('#modal button,#modal input,#modal select')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0]?.focus()}}return}if(/input|select|textarea/i.test(e.target.tagName))return;if(e.key==='/'){e.preventDefault();doAction('search')}if(e.key==='Escape'&&st.item){doAction(st.source?'sourceback':'back')}});
window.addEventListener('popstate',()=>{dismiss(false);st={...base,...Object.fromEntries(new URLSearchParams(location.hash.slice(1)))};render();$('#main').focus()});render();
</script></body></html>
