name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  # Scheduled default-branch runs keep full e2e scope even when most routine
  # localized pull requests qualify for the narrow lane. Scheduled and
  # dispatch runs use the same two-lane split as a full pull request, so
  # every spec runs exactly once per event: allowlisted specs against the
  # production build, every other spec on the dev-server matrix.
  schedule:
    - cron: '17 9 * * *'
  # merge-on-green refreshes stale branches with GITHUB_TOKEN. GitHub records
  # the refreshed head's pull_request run as held (action_required, no jobs),
  # and the controller re-runs that held run: it is the run the pull request's
  # required-check rollup reads (#874). Dispatching this workflow is only the
  # fallback for when no pull_request run appears for the refreshed head.
  workflow_dispatch:
    inputs:
      # On that fallback path the dispatched run may be the only CI run that has
      # executed for the sha (its checks alone do not satisfy the pull request's
      # rollup), so the migration-namespace guard has to be able to earn
      # PULL_REQUEST mode in it. github.event.pull_request.number does not exist on a dispatch, so the
      # controller passes the number it already knows (scripts/merge_on_green.py,
      # dispatch_ci). Optional: a hand-run dispatch that omits it stays LENIENT
      # and the guard's printed mode line says exactly that.
      pr_number:
        description: "Pull request number this run is proving (blank for a plain branch run)"
        type: string
        required: false
        default: ''

# Candidate code receives only the repository read authority needed by checkout.
# Privileged merge reconciliation remains isolated in merge-on-green.yml.
permissions:
  contents: read

# Supersede only expensive jobs; a required fan-in must never hold a
# workflow-wide lock against newer heads. A canceled test remains red.

jobs:
  # Trusted-base PR scope (Mastermind #917 CI acceleration, 2026-11-05).
  # Classifies the exact pull-request merge commit from Git objects only: a
  # prose-only change (Markdown under docs/ and terminal/docs/ minus the
  # sub-trees and files that code or tests read, plus raster evidence images
  # under docs/evidence/ and terminal/docs/pr-crops/; see the allowlist in
  # scripts/ci_pr_scope.py) is mode=docs, and the unit, e2e, ingest and
  # PostgreSQL jobs below are then
  # skipped or reduced to a no-op that still reports its required context
  # green. Anything else -- or anything the classifier cannot qualify: a base
  # mismatch, a symlink, an executable bit, a type change, a classifier missing
  # from the base -- is mode=full, exactly what this workflow always ran. The
  # classifier executes from the protected base commit (HEAD^1 of the merge
  # commit), so a pull request cannot reclassify itself. Other events never
  # receive the docs exemption; their existing event-specific checks remain.
  pr_scope:
    name: PR test scope
    # Only a pull request against the protected default branch is classified;
    # a PR targeting any other branch runs the full suite (the classifier is
    # taken from HEAD^1, which is only trusted when that is the default branch).
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit plus both parents: the classifier diffs HEAD^1..HEAD
          # and is itself taken from HEAD^1, the protected base.
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the exact merge commit using protected base code
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/ci-trusted-base"
          mkdir -p "$trusted"
          if git cat-file -e "HEAD^1:scripts/ci_pr_scope.py" 2>/dev/null; then
            git archive HEAD^1 scripts/ci_pr_scope.py | tar -x -C "$trusted"
            python3 "$trusted/scripts/ci_pr_scope.py" \
              --repo "$GITHUB_WORKSPACE" --base-sha "$PR_BASE_SHA" \
              --base-ref "$PR_BASE_REF" --default-branch "$DEFAULT_BRANCH" \
              --output "$GITHUB_OUTPUT"
          else
            printf 'mode=full\nreason=CLASSIFIER_NOT_IN_PROTECTED_BASE\n' >> "$GITHUB_OUTPUT"
            echo 'CI_SCOPE mode=full reason=CLASSIFIER_NOT_IN_PROTECTED_BASE'
          fi

  hub:
    concurrency:
      group: terminal-ci-${{ github.event.pull_request.number || github.ref }}-hub
      cancel-in-progress: true
    name: Quote Hub tests
    runs-on: ubuntu-latest
    needs: [pr_scope]
    # A docs-only pull request (pr_scope mode=docs) still COMPLETES this
    # required context green: every step below is skipped, so branch
    # protection and scripts/merge_on_green.py (`conclusion == success`)
    # read it as proven. `!cancelled()` keeps the job running when pr_scope
    # itself failed or was skipped: mode is then empty and every step runs.
    if: ${{ !cancelled() }}
    defaults:
      run:
        working-directory: hub
    steps:
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        uses: actions/checkout@v4
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        run: npm ci
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        run: npm test
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hub/requirements-futures.txt
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        name: Futures offline SDK and source conformance
        run: |
          python -m pip install -r requirements-futures.txt
          python -m unittest discover -s tests -p 'test_futures_*.py' -v

  e2e-scope:
    name: Terminal browser scope selection
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      matrix: ${{ steps.select.outputs.matrix }}
      prodbuild_matrix: ${{ steps.select.outputs.prodbuild_matrix }}
      prodbuild_count: ${{ steps.select.outputs.prodbuild_count }}
    steps:
      # The pull_request checkout is the immutable synthetic merge commit.
      # Its first parent is exactly the base that this CI candidate received.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fail-closed source-bound scope selection
        id: select
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Pull requests cannot modify their own selector to claim a narrower
          # proof. Execute the selector from the synthetic merge commit's
          # immutable first parent (the protected base for this exact run).
          # Bootstrap, other events, unknown Git state or absent base script
          # always run the canonical FULL matrix without executing PR code.
          TRUSTED=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] &&
             [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ] &&
             [ "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = "3" ]; then
            BASE=$(git rev-parse HEAD^1)
            if [ "$(git cat-file -t "${BASE}:scripts/ci_e2e_scope.py" 2>/dev/null || true)" = "blob" ]; then
              TRUSTED="${RUNNER_TEMP}/trusted_ci_e2e_scope.py"
              git show "${BASE}:scripts/ci_e2e_scope.py" > "${TRUSTED}"
            fi
          fi
          if [ -n "${TRUSTED}" ]; then
            python3 "${TRUSTED}"
            # The protected selector still owns full vs focused scope. Expand only
            # its exact legacy full desktop/tablet sets after the observed one-hour
            # cancellations (#801/#1296). Preserve all other rows and the selector's
            # exit status; never execute the candidate's selector here.
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["GITHUB_OUTPUT"])
          fields = dict(line.split("=", 1) for line in output.read_text().splitlines() if "=" in line)
          if fields.get("mode") == "full":
              matrix = json.loads(fields["matrix"])
              if isinstance(matrix, dict) and set(matrix) == {"include"}:
                  for project, old_count, new_count, before, after in (
                      ("desktop", 5, 6, "fifths", "sixths"),
                      ("tablet", 3, 4, "thirds", "quarters"),
                      ("mobile", 3, 5, "thirds", "fifths"),
                  ):
                      rows = matrix["include"]
                      if not isinstance(rows, list) or not all(isinstance(row, dict) for row in rows):
                          break
                      legacy = [
                          {"shard": f"{project}-{i}", "projects": f"--project={project} --shard={i}/{old_count}", "specs": ""}
                          for i in range(1, old_count + 1)
                      ]
                      selected = [row for row in rows if str(row.get("shard", "")).startswith(project + "-")
                                  or f"--project={project}" in str(row.get("projects", "")).split()]
                      if selected == legacy:
                          first = rows.index(selected[0])
                          expanded = [
                              {"shard": f"{project}-{i}", "projects": f"--project={project} --shard={i}/{new_count}", "specs": ""}
                              for i in range(1, new_count + 1)
                          ]
                          matrix["include"] = rows[:first] + expanded + [
                              row for row in rows[first:] if row not in legacy
                          ]
                          with output.open("a", encoding="utf-8") as target:
                              target.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
                          print(f"e2e-scope: split protected full {project} {before} into {after}; all cases retained")
                  # Split only the exact old protected serial row. The source
                  # selector still owns scope; preserve custom/filtered topology.
                  projects = (
                      "company-intelligence-desktop", "company-intelligence-tablet",
                      "company-intelligence-mobile", "terminal-chrome-intermediate",
                      "w2a-workspaces",
                  )
                  tokens = tuple(f"--project={project}" for project in projects)
                  legacy_serial = {"shard": "serial", "projects": " ".join(tokens), "specs": ""}
                  rows = matrix["include"]
                  if isinstance(rows, list) and all(isinstance(row, dict) for row in rows):
                      related = [
                          row for row in rows
                          if row.get("shard") in ("serial", "serial-standalone")
                          or any(token in str(row.get("projects", "")).split() for token in tokens)
                      ]
                      if related == [legacy_serial]:
                          first = rows.index(legacy_serial)
                          replacements = [
                              {"shard": "serial", "projects": " ".join(tokens[:3]), "specs": ""},
                              {"shard": "serial-standalone", "projects": " ".join(tokens[3:]), "specs": ""},
                          ]
                          matrix["include"] = rows[:first] + replacements + rows[first + 1:]
                          with output.open("a", encoding="utf-8") as target:
                              target.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
                          print("e2e-scope: split protected full serial row; dependency chain and all cases retained")
          PY
          else
            python3 - <<'PY'
          import json
          import os

          matrix = [
              {"shard": f"{name}-{i}",
               "projects": f"--project={name} --shard={i}/{total}",
               "specs": ""}
              for name, total in (("desktop", 6), ("tablet", 4), ("mobile", 5))
              for i in range(1, total + 1)
          ]
          # The Company dependency chain stays atomic. Independent projects run
          # once in a separate whole-project row under the unchanged hang cap.
          for label, projects in (
              ("serial", ("company-intelligence-desktop", "company-intelligence-tablet",
                          "company-intelligence-mobile")),
              ("serial-standalone", ("terminal-chrome-intermediate", "w2a-workspaces")),
          ):
              matrix.append({
                  "shard": label,
                  "projects": " ".join(f"--project={project}" for project in projects),
                  "specs": "",
              })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("mode=full\n")
              output.write("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")) + "\n")
          print("e2e-scope: full (immutable protected selector unavailable or non-PR)")
          PY
          fi
          # Stage 1 lane split for runs whose selector did not emit one: every
          # non-PR event (the inline matrix above) and pull requests whose
          # protected base selector predates the prod lane. The rule is the one
          # in scripts/ci_e2e_scope.py split_lanes, held equal by
          # tests/test_ci_e2e_shards.py. No candidate code executes: the
          # allowlist and the spec filenames are read as data, the shard shape
          # is fixed, and a spec moves off the dev rows only together with the
          # prod shards that run it. Anything that cannot be proven a complete
          # split leaves the matrix untouched with an empty prod lane.
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          output = Path(os.environ["GITHUB_OUTPUT"])
          fields = dict(
              line.split("=", 1)
              for line in output.read_text().splitlines()
              if "=" in line
          )
          if "prodbuild_count" not in fields:
              root = Path("terminal/e2e")
              allowlist_path = root / "prodbuild-allowlist.txt"
              safe = re.compile(r"[A-Za-z0-9._-]+\.spec\.ts\Z")
              responsive = ("desktop", "tablet", "mobile")

              def projects(row):
                  return [token.split("=", 1)[1] for token in str(row.get("projects", "")).split()
                          if token.startswith("--project=")]

              dev = None
              prod = []
              rows = json.loads(fields["matrix"]).get("include")
              if os.environ.get("GITHUB_EVENT_NAME", "") == "merge_group":
                  reason = "merge_group runs no browser jobs"
              elif fields.get("mode") != "full":
                  reason = "focused scope keeps its explicit dev rows"
              elif not allowlist_path.is_file():
                  reason = "no allowlist on this ref"
              elif not isinstance(rows, list) or not all(isinstance(row, dict) for row in rows):
                  reason = "unrecognized dev matrix"
              else:
                  moved = {line.strip() for line in allowlist_path.read_text(encoding="utf-8").splitlines()
                           if line.strip()}
                  names = sorted(path.name for path in root.glob("*.spec.ts"))
                  unroutable = sorted(
                      path.relative_to(root).as_posix() for path in root.rglob("*.spec.*")
                      if path.parent != root or not safe.fullmatch(path.name)
                  )
                  prod_specs = " ".join(f"e2e/{name}" for name in names if name in moved)
                  dev_specs = " ".join(f"e2e/{name}" for name in names if name not in moved)
                  split = [
                      project for project in responsive
                      if any(project in projects(row) for row in rows)
                      and all(projects(row) == [project] and row.get("specs") == ""
                              for row in rows if project in projects(row))
                  ]
                  for entry in sorted(moved - set(names)):
                      print(f"::warning::prodbuild allowlist entry is not a spec on this ref: {entry!r}")
                  if unroutable:
                      reason = f"spec files an explicit list cannot route: {unroutable[:5]!r}"
                  elif not prod_specs or not dev_specs or not split:
                      reason = "nothing to split"
                  else:
                      reason = f"{len(prod_specs.split())} allowlisted, {len(dev_specs.split())} dev spec(s)"
                      dev = [
                          {**row, "specs": dev_specs}
                          if any(project in split for project in projects(row)) else row
                          for row in rows
                      ]
                      prod = [
                          {"shard": f"prodbuild-{project}-{index}",
                           "projects": f"--project={project}" + (f" --shard={index}/{count}" if count > 1 else ""),
                           "specs": prod_specs}
                          for project, count in (("desktop", 2), ("tablet", 1), ("mobile", 1))
                          if project in split
                          for index in range(1, count + 1)
                      ]
              with output.open("a", encoding="utf-8") as target:
                  if dev is not None:
                      target.write("matrix=" + json.dumps({"include": dev}, separators=(",", ":")) + "\n")
                  target.write("prodbuild_matrix=" + json.dumps({"include": prod}, separators=(",", ":")) + "\n")
                  target.write(f"prodbuild_count={len(prod)}\n")
              print(f"e2e-scope lane split: {len(prod)} prodbuild shard(s) ({reason})")
          PY

  terminal-unit:
    concurrency:
      group: terminal-ci-${{ github.event.pull_request.number || github.ref }}-terminal-unit
      cancel-in-progress: true
    needs: [pr_scope, e2e-scope]
    # The browser selector stays mandatory. PR scope only grants the docs
    # exemption; its failure or absence falls back to normal qualification.
    if: ${{ !cancelled() && needs.e2e-scope.result == 'success' && !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
    name: Terminal unit + typecheck (shard)
    runs-on: ubuntu-latest
    # Existing stages had20min. Allow10min setup +55min incumbent captures,
    # +30min conditional full EOD capture +5min retention. Original30-case M2
    # report took1,018,995ms (~17min) before24layout cases. These120min bounds
    # are not a claim that126 EOD captures finish within their30min allowance.
    # See8f1dc846: terminal/docs/pr-crops/terminal-visual-intelligence/asc1233-vi-ci-20261103--report.json.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: terminal
    steps:
      # fetch-depth 2, not the default 1, exists for the plain-language guard's
      # enforce step at the end of this job. On a pull_request run HEAD is the
      # merge commit GitHub computed, and that step takes its base from HEAD^1
      # -- the merge commit's first parent -- which depth 1 does not fetch.
      # actions/checkout does the deepening itself, against the exact ref it
      # checks out (refs/pull/N/merge), so the parents come down with it. A
      # later `git fetch --deepen=1 origin` would not reliably do the same:
      # checkout leaves remote.origin.fetch pointing at refs/heads/*, and the
      # merge commit sits on no branch, so there is nothing there to deepen
      # along. Only this job pays for the extra commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - name: Retain actual checkout and observed event identities
        run: node e2e/tools/capture_ci_evidence.cjs --checkout-only
      - run: npm ci
      # next-env.d.ts and .next/ route types are gitignored; generate them first
      # for the full-project CI gate (application, tests and tooling remain checked).
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Check immutable evidence orchestration (synthetic)
        timeout-minutes: 1
        run: node --test e2e/tools/capture_ci_evidence.test.cjs e2e/tools/capture_visual_evidence.test.cjs scripts/ci/plan-evidence-capture.test.cjs e2e/tools/sharedShellSafeReporter.test.cjs e2e/tools/capture_b_f11_10_analysis_theses_entry.test.cjs e2e/tools/f11_provider_closed_policy.test.cjs
      - name: Record PR-touched paths for the evidence drift gate
        # The planner below fails a pull request whose OWN diff drifted an
        # evidence-locked source without a recaptured, committed lock — the
        # same drift the merge-group backstop discovers only after merge
        # qualification starts. HEAD^1 of the pull_request synthetic merge
        # commit is the exact base tip this candidate received (the same
        # identity the plain-language guard below relies on); the depth-2
        # checkout already fetches it. Non-PR events skip this step and the
        # gate stays silent for them.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD^1)
          git diff --name-only --no-renames "${BASE}" HEAD > "${RUNNER_TEMP}/evidence-pr-touched.txt"
          {
            echo "EVIDENCE_PR_TOUCHED_FILE<<__mmx-evidence-touched-eof__"
            cat "${RUNNER_TEMP}/evidence-pr-touched.txt"
            echo "__mmx-evidence-touched-eof__"
          } >> "${GITHUB_ENV}"
      - name: Plan current-source evidence capture
        id: evidence_plan
        run: node scripts/ci/plan-evidence-capture.cjs
      - name: Prepare Chromium for original mock captures
        # F11 always qualifies this admitted checkout and needs Chromium even
        # when the PL6/VI planner can reuse both current-source evidence locks.
        timeout-minutes: 10
        run: |
          timeout --signal=TERM --kill-after=15s 240s npx playwright install --with-deps chromium \
            || { echo "::warning::Dependency installation failed or stalled; trying browser-only installation"; timeout --signal=TERM --kill-after=15s 180s npx playwright install chromium; }
      - name: Capture and validate evidence on this checkout
        if: github.event_name != 'merge_group' || steps.evidence_plan.outputs.capture == 'true'
        timeout-minutes: 85
        run: node e2e/tools/capture_ci_evidence.cjs
      # F11 is a separate real-component contract, not an extra case in PL6/VI50.
      # Business inputs are intercepted as unavailable before reaching API/provider code.
      - name: Capture provider-closed F11 theses entry on this checkout
        timeout-minutes: 8
        run: node e2e/tools/capture_b_f11_10_analysis_theses_entry.cjs
      - run: npm test
        timeout-minutes: 20
      # Quarantined journeys are disclosed on EVERY run: a green matrix must never be read as
      # full coverage. Bare `echo`, never a logger — a logger prefix pushes `::warning` off the
      # start of the line and GitHub silently drops the annotation.
      - name: Disclose quarantined e2e journeys
        run: |
          if [ ! -f e2e/QUARANTINE.md ]; then
            echo "::error title=e2e-quarantine::terminal/e2e/QUARANTINE.md is missing"
            exit 1
          fi
          awk -F'|' '/^## Observed but NOT quarantined/ { exit }
          /^\| *terminal\/e2e\// && NF == 8 {
            for (i = 1; i <= NF; i++) { gsub(/^[ \t]+|[ \t]+$/, "", $i) }
            print "::warning title=e2e-quarantine::" $2 " — " $3 " — owner: " $6 " — evidence: " $5 " — re-enable: " $7
            n++
          }
          END { print n+0 > "/tmp/quarantine_row_count.txt" }' e2e/QUARANTINE.md
          fixme_count=$(grep -rc "test\.fixme(" e2e | awk -F: '{s+=$2} END {print s+0}')
          row_count=$(cat /tmp/quarantine_row_count.txt 2>/dev/null || echo 0)
          if [ "$fixme_count" != "$row_count" ]; then
            echo "::error title=e2e-quarantine::terminal/e2e has $fixme_count test.fixme( occurrence(s) but QUARANTINE.md's quarantine table has $row_count row(s) — every quarantined test needs a disclosed row, and every row needs a live test.fixme"
            exit 1
          fi
      # The Chairman's plain-language law gets a Terminal-side enforcer here.
      # terminal/scripts/check_plain_language.mjs (packet B-PL-5) is a
      # forward-only guard, but until packet B-PLAT-B5-1 no job ran it: a PR
      # could put a raw state enum or an untranslated stat token in front of a
      # user and every required check still went green.
      #
      # These two steps run LAST in the job. The packet census permits this
      # placement -- "after npm test" -- and landing them after the
      # quarantine disclosure above specifically. That disclosure's comment
      # promises it runs on EVERY run, but it carries no `if: always()`; on
      # any run where the disclosure step itself executes, a guard step
      # placed before it would, the first time it found a blocking line, skip
      # the disclosure outright. Placing the guard last instead keeps that
      # promise intact wherever it already holds, rather than giving it a new
      # way to break.
      #
      # Step 1 proves the guard still works before anyone trusts its verdict.
      # Each rule is fed a fixture that violates it, through the same
      # scanLines() the real scan uses; a rule that no longer fires exits 2 and
      # turns this job red. A dead guard must never read as a clean tree.
      - name: Plain-language guard self-check
        run: node scripts/check_plain_language.mjs --self-check
      # Step 2 enforces, forward-only: a finding on a line THIS pull request
      # ADDED is blocking and fails the step, while the same finding on a
      # pre-existing line is printed as the legacy census and never turns a PR
      # red. An untouched legacy file cannot fail this step.
      #
      # WHICH COMMIT IS THE BASE is what makes that last sentence true or false.
      #
      # On `pull_request`, HEAD is the merge commit M that GitHub built when
      # this run was triggered: the branch merged into the base tip AS IT WAS
      # THEN. So the base must be M's FIRST PARENT, which is exactly that tip.
      # Re-fetching refs/heads/master at STEP time instead reads master AS IT
      # IS NOW, and master can advance while this job runs. Every line those
      # newer commits changed still stands in M in its older form, so
      # `git diff master@now M` emits it as an ADDED line -- and a legacy
      # finding in a file this PR never opened turns the check red. That is the
      # precise false red the forward-only promise exists to prevent. HEAD^1
      # cannot drift, because M is fixed; it resolves because this job's
      # checkout asks for fetch-depth 2.
      #
      # Off `pull_request` (the fallback workflow_dispatch run merge-on-green
      # fires on a refreshed branch, or a hand dispatch) there is no merge commit, so the base branch tip
      # is fetched explicitly -- a shallow checkout does not contain it, and
      # without the fetch $BASE cannot resolve at all. This step always passes
      # --diff-file (never --since), so an unresolved $BASE does not fail
      # open: `git diff --unified=0 "$BASE" HEAD` fails under
      # `set -euo pipefail` and the step dies loudly, having invoked the guard
      # on nothing. The fetch exists so $BASE resolves, not to avoid a silent
      # pass. Once it resolves, the diff is base tip vs HEAD, so the branch's
      # OWN changes count as added and can block, which is the point of
      # re-running the proof. A pre-existing line can only surface as added on
      # that path if the branch is BEHIND the base (git reads the branch's
      # older copy of a line the base has since changed as an addition). That
      # window is narrow on the merge-on-green path: the controller polls the
      # pull request until update-branch has written the new head and only
      # dispatches when no pull_request run appeared for it. A hand dispatch
      # can still race a behind branch. Failure direction stays false-red only.
      #
      # `set -euo pipefail` so the step fails CLOSED: an unresolvable HEAD^1
      # kills it loudly instead of leaving BASE empty and passing green.
      #
      # The diff is deliberately taken with TWO dots: `git diff A B` compares
      # two trees and needs no merge base, whereas a three-dot `A...B` needs
      # one, and two shallow histories give git nothing to find it in.
      #
      # BASE_REF is read from the environment rather than interpolated into
      # the shell text: a branch name is attacker-controllable. The pathspec is
      # written `:/terminal` (relative to the repo root) because this job's
      # steps run inside terminal/, and it is a superset of every path the
      # guard scans, so it cannot go stale against the guard's own globs.
      - name: Plain-language guard (forward-only, added lines block)
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE=$(git rev-parse HEAD^1)
          elif [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # The event freezes both trees. A later master must not turn an
            # untouched legacy line into a newly added line on this candidate.
            for SHA in "${MERGE_GROUP_BASE_SHA}" "${MERGE_GROUP_HEAD_SHA}"; do
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid merge-group commit identity" >&2; exit 1; }
            done
            [ "${MERGE_GROUP_BASE_REF}" = "refs/heads/${BASE_REF}" ] || { echo "Wrong merge-group base ref" >&2; exit 1; }
            case "${MERGE_GROUP_HEAD_REF}" in
              "refs/heads/gh-readonly-queue/${BASE_REF}/"?*) ;;
              *) echo "Invalid merge-group head ref" >&2; exit 1 ;;
            esac
            [ "${GITHUB_REF}" = "${MERGE_GROUP_HEAD_REF}" ] || { echo "Merge-group ref differs from checkout ref" >&2; exit 1; }
            [ "${GITHUB_SHA}" = "${MERGE_GROUP_HEAD_SHA}" ] || { echo "Merge-group SHA differs from workflow SHA" >&2; exit 1; }
            [ "$(git rev-parse HEAD)" = "${MERGE_GROUP_HEAD_SHA}" ] || { echo "Merge-group SHA differs from checked-out commit" >&2; exit 1; }
            BASE="${MERGE_GROUP_BASE_SHA}"
            # Fetch the exact object rather than resolving the moving branch.
            git fetch --no-tags --depth=1 origin "$BASE"
            [ "$(git rev-parse "${BASE}^{commit}")" = "$BASE" ] || { echo "Merge-group base is not the exact commit" >&2; exit 1; }
          else
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            BASE="refs/remotes/origin/${BASE_REF}"
          fi
          git diff --unified=0 "$BASE" HEAD -- ':/terminal' > "${RUNNER_TEMP}/plain-language.diff"
          node scripts/check_plain_language.mjs --mode enforce-added --diff-file "${RUNNER_TEMP}/plain-language.diff"

      - name: Retain current-checkout mock evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/terminal-ci-evidence/
            terminal/test-results/
            terminal/docs/pr-crops/b-f11-10-analysis-theses-entry/
            terminal/docs/pr-crops/b-pl-6-batch-1/ci-${{ github.run_id }}-${{ github.run_attempt }}-*
            terminal/docs/pr-crops/terminal-visual-intelligence/ci-${{ github.run_id }}-${{ github.run_attempt }}-*
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/EVIDENCE.yml
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/*.png
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/operations/**/revisions/**/native-packet.json
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/operations/**/revisions/**/capture-*
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/operations/**/revisions/**/capture.log
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/operations/**/revisions/**/source-contract.json
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/operations/**/revisions/**/history.json
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/operations/**/revisions/**/EVIDENCE.before.yml
            terminal/docs/pr-crops/eod-heatmap-flowdesk-load-failure/operations/**/revisions/**/qualified-root/
            terminal/docs/pr-crops/b-pl-6-batch-2/
            terminal/docs/pr-crops/options-level-axis-labels/manifest.json
            terminal/docs/pr-crops/options-level-axis-labels/*.png
          if-no-files-found: warn

  terminal-e2e:
    concurrency:
      group: terminal-ci-${{ github.event.pull_request.number || github.ref }}-terminal-e2e-${{ matrix.shard }}
      cancel-in-progress: true
    name: Terminal e2e ${{ matrix.shard }} (shard)
    # Lane switch (Mastermind #917, phase 9; canary runs 42011181810 / 42029519496 on
    # 2026-11-05: desktop-1 jobs 16m06s at one worker and 8m08s at four on ubuntu0;
    # the four-worker command took 431s and the whole workflow 17m36s). The repository variable TERMINAL_E2E_LANE chooses the lane: unset
    # or any value other than `ubuntu0` (GitHub compares case-insensitively) keeps every
    # selected shard on the hosted runner; `ubuntu0` ROUTES eligible same-repository
    # pull_request and workflow_dispatch jobs to the ubuntu0 runner slots.
    # The accepted scope condition below still skips native merge-group jobs
    # (labels below, names ubuntu0-e2e-N; docs/CI_TERMINAL_E2E_SELFHOSTED_LANE.md).
    #
    # What the expression does and does not protect. The head.repo guard is ROUTING
    # ONLY: it keeps this unmodified job off the host for a fork pull_request. It is
    # not a host fence, because a pull_request runs the workflow file from the PR's
    # merge ref, so any PR (fork or same-repo) may edit this `runs-on` or add a
    # workflow naming the four labels, and merge_group runs fork-authored code once a
    # maintainer queues it. The host fence is procedural and lives outside this file:
    # fork runs are held by the all_external_contributors approval policy, and the
    # runbook requires ephemeral, no-sudo runner slots inside an organization runner
    # group restricted to this repository. Unsetting the variable restores hosted
    # routing only; stopping the slot listeners is the full rollback. Lane-dependent
    # values (workers, ports, browser store) are bound by
    # .github/scripts/terminal_e2e_lane.sh from env, never spliced into a run block.
    # tests/test_ci_e2e_selfhosted_lane.py pins this contract with mutation tests.
    # 2026-11-10: the hosted fallback is `ubuntu-24.04`, not `ubuntu-latest`. The
    # fleet runners also carry `ubuntu-latest` (intentionally kept), so the old
    # fallback sent "hosted" shards to a shared fleet host. On 2026-11-10 (00:00-08:20
    # UTC) 16/26 PR shard jobs failed there (62%) versus 11/273 on GitHub-hosted runners
    # (4%). Job logs show two causes: the fixed localhost port 3108 was already
    # used by a neighbouring slot sharing the host, and `npx playwright install
    # --with-deps` stalled on the shared host's apt state. `ubuntu-24.04` is a
    # GitHub-hosted image label that no fleet runner carries; the ubuntu0-e2e
    # branch above is unchanged and still owns all fleet e2e capacity.
    runs-on: ${{ (vars.TERMINAL_E2E_LANE == 'ubuntu0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","ubuntu0-e2e"]') || 'ubuntu-24.04' }}
    env:
      TERMINAL_E2E_LANE: ${{ (vars.TERMINAL_E2E_LANE == 'ubuntu0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'ubuntu0' || 'hosted' }}
      TERMINAL_E2E_LANE_WORKERS: ${{ vars.TERMINAL_E2E_WORKERS }}
    needs: [pr_scope, e2e-scope]
    # Source PRs run the independently selected responsive matrix. Trusted
    # docs-only PRs and native merge groups have separate, explicit skip rules.
    # Neither rule permits a failed selector or claims fresh browser proof.
    if: ${{ !cancelled() && needs.e2e-scope.result == 'success' && github.event_name != 'merge_group' && !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
    # 6h default masked a 70-min job. Bound it. On 2026-10-04 the slowest shards measured
    # tablet ~35-36 min and each desktop half ~28-31 min (from the old whole-desktop runs).
    # By 2026-10-12 the whole tablet project ran 47-59 min and the whole mobile project
    # 44-56 min on green runs, and both were cancelled at the cap on slower runners
    # (#953, #954, #959, #960), so they were split into halves exactly like desktop.
    # On 2026-10-20 a mobile HALF still reached the unchanged cap (#1061): run
    # 39403170318, job 118563127930 started 09:48:07 UTC, selected 513 tests with
    # the single CI worker at 09:49:29, and was still passing with no assertion
    # failure when the host cancelled it at 10:48:24 (60m17s), so mobile runs in
    # thirds below.
    # On 2026-11-10 mobile thirds still reached the unchanged cap (#1411): run
    # 42753497499, mobile-1 took 54 min and mobile-3 took 58 min, while mobile-2 was
    # cancelled at the 60-minute cap twice with ZERO test failures — on attempt 2 the
    # suite itself took 58.0 min on the single CI worker (416 passed, 144 skipped) and
    # the job was cancelled during the artifact upload that follows.
    # So mobile now runs in fifths below, same cap untouched.
    # This cap is a hang detector, not a budget to grow into: when a shard creeps toward it,
    # split that shard (as desktop, tablet and mobile are below), never just raise the number.
    timeout-minutes: 60
    strategy:
      # Full shards and focused specs are owned by scripts/ci_e2e_scope.py.
      # tests/test_ci_e2e_shards.py validates project/shard coverage.
      # Unknown, high-risk, CI/config and merge-group changes always select FULL.
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-scope.outputs.matrix) }}
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - name: Bind lane workers and ports
        id: lane
        run: bash ../.github/scripts/terminal_e2e_lane.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npx next typegen
      # Resolve the exact Playwright version so the browser cache key can never serve a
      # binary that does not match the client. A miss just reinstalls (23s) — never a false green.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ${{ steps.lane.outputs.browsers_path }}
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}${{ steps.lane.outputs.cache_suffix }}
      # `--with-deps` shells out to apt, and the runner's Ubuntu mirror stalls often enough to
      # matter (see #438). Bound it, then fall back to a browser-only install.
      - name: Install Playwright browsers (apt bounded, browser-only fallback)
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          timeout 480 npx playwright install --with-deps chromium \
            || { echo "::warning::apt/--with-deps stalled or failed — installing the browser only"; \
                 npx playwright install chromium; }
      # Browser caches do not include system fonts on fresh hosted runners.
      - name: Ensure browser present on cache hit
        if: steps.pwcache.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: |
          if [ "$TERMINAL_E2E_LANE" = "hosted" ]; then
            timeout --signal=TERM --kill-after=15s 240s npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - run: npm run test:e2e:responsive -- ${{ matrix.projects }} ${{ matrix.specs }} --workers="$TERMINAL_E2E_WORKERS"
        env:
          TERMINAL_E2E_PORT: ${{ steps.lane.outputs.port }}
          TERMINAL_E2E_WORKERS: ${{ steps.lane.outputs.workers }}
      # This feature is default-off; the ordinary matrix skips its browser tests.
      # Exercise it with the SAME harness, without altering production flags.
      - name: Qualify investor shell opt-in
        if: matrix.shard == 'serial'
        env:
          MMX_INVESTOR_SHELL_PREVIEW: '1'
          CI: '1'
          TERMINAL_E2E_PORT: ${{ steps.lane.outputs.port_investor }}
        run: >-
          npm run test:e2e:responsive -- e2e/investor-shell-preview.spec.ts
          --project=desktop --project=tablet --project=mobile
          --workers=1 --retries=0
          --output=test-results/investor-shell-preview
      - name: Qualify Shared Shell beta presentation
        id: shared_shell_qa
        if: matrix.shard == 'serial'
        env:
          MMX_SHARED_SHELL: '1'
          TERMINAL_E2E_CLOSED_CANONICAL_TRANSPORT: 'intl-fixture-v1'
          CI: '1'
          TERMINAL_E2E_PORT: ${{ steps.lane.outputs.port_shared }}
        run: >-
          npm run test:e2e:responsive -- e2e/shared-shell-refinement.spec.ts e2e/intl-history-date-intent.spec.ts e2e/discover-focus-continuity.spec.ts
          --project=desktop --project=tablet --project=mobile
          --workers=1 --retries=0
          --output=test-results/shared-shell-refinement
          --reporter=github,./e2e/tools/sharedShellSafeReporter.cjs
      - name: Validate bounded Shared Shell outcome
        id: safe_shared_shell_summary
        if: ${{ always() && matrix.shard == 'serial' && steps.shared_shell_qa.outputs.safe_shared_shell_initialized == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          SAFE_DIRECTORY_DEV: ${{ steps.shared_shell_qa.outputs.safe_shared_shell_directory_dev }}
          SAFE_DIRECTORY_INO: ${{ steps.shared_shell_qa.outputs.safe_shared_shell_directory_ino }}
          SAFE_FILE_DEV: ${{ steps.shared_shell_qa.outputs.safe_shared_shell_file_dev }}
          SAFE_FILE_INO: ${{ steps.shared_shell_qa.outputs.safe_shared_shell_file_ino }}
          SAFE_FILE_SHA256: ${{ steps.shared_shell_qa.outputs.safe_shared_shell_file_sha256 }}
          SAFE_STEP_OUTCOME: ${{ steps.shared_shell_qa.outcome }}
        run: node e2e/tools/sharedShellSafeReporter.cjs --publish-safe-summary
      - name: Retain bounded Shared Shell outcome
        if: ${{ always() && matrix.shard == 'serial' && steps.safe_shared_shell_summary.outcome == 'success' && steps.safe_shared_shell_summary.outputs.safe_shared_shell_summary_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-${{ github.run_id }}-serial-safe-summary-${{ github.run_attempt }}
          path: ${{ steps.safe_shared_shell_summary.outputs.safe_shared_shell_summary_path }}
          if-no-files-found: warn
      # This opt-in route family is not exercised by the generic shell test above.
      # Run the existing loopback-only browser journey on the checked-out source;
      # its fixture authorization is not authenticated beta/production acceptance.
      - name: Qualify Intelligence native beta routes (fixture browser)
        if: matrix.shard == 'serial'
        timeout-minutes: 20
        env:
          CI: '1'
          INTELLIGENCE_TEST_PORT: '31993'
          INTELLIGENCE_TEST_VARIANT: ci-intelligence-${{ github.run_id }}-${{ github.run_attempt }}
        run: node e2e/tools/qualify_shared_shell_intelligence.cjs
      - name: Upload Intelligence fixture-browser evidence
        if: always() && matrix.shard == 'serial'
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-beta-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: terminal/docs/pr-crops/shared-shell-intelligence-20261103/ci-intelligence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 HARD-FAILS on duplicate names across a matrix. The shard
          # suffix is mandatory, not cosmetic.
          name: responsive-qa-${{ github.run_id }}-${{ matrix.shard }}
          path: terminal/test-results
          if-no-files-found: ignore

  terminal-e2e-build:
    concurrency:
      group: terminal-ci-${{ github.event.pull_request.number || github.ref }}-terminal-e2e-build
      cancel-in-progress: true
    name: Terminal e2e production build
    needs: [pr_scope, e2e-scope]
    # Exactly the dev lane's event shape plus a nonempty prod lane: native merge
    # groups and trusted docs-only PRs skip the browser work, so they never pay
    # for a build either. No merge_group run executes this job.
    if: ${{ !cancelled() && needs.e2e-scope.result == 'success' && github.event_name != 'merge_group' && needs.e2e-scope.outputs.prodbuild_count != '0' && !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terminal
    env:
      # Mirrors terminal/playwright.config.ts webServer.env and the canary build
      # leg exactly. NEXT_PUBLIC_* keys are inlined by next build, so they must
      # be set here; they are the same fixture literals the dev lane uses.
      ANALYSIS_LOCAL_PREVIEW: "1"
      ADMIN_DEV: "1"
      TERMINAL_E2E_FIXTURE: "1"
      TERMINAL_E2E_EMAIL: "responsive@example.com"
      TERMINAL_E2E_ENTITLEMENT: "unlimited"
      RATE_LIMIT_MAX: "100000"
      HUB_REALTIME_QUOTES: "1"
      TICKER_NEWS_RAIL: "1"
      FLOW_FIXTURE: "1"
      INVESTIGATION_API_ADMISSION: "open"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "fixture-anon-key"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - name: Production build (npx next build skips the prebuild hook)
        # NOT `npm run build`: its prebuild writes public/data/coverage.json,
        # which production mode must not regenerate.
        run: |
          t0=$(date +%s)
          npx next build
          echo "### Production build" >> "$GITHUB_STEP_SUMMARY"
          echo "build_seconds=$(( $(date +%s) - t0 )) nproc=$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pack .next (exclude cache/dev/traces)
        run: |
          tar -czf ../dot-next.tar.gz \
            --exclude='.next/cache' \
            --exclude='.next/dev' \
            --exclude='.next/trace' \
            --exclude='.next/BUILD_ID.trace' \
            -C . .next
          ls -lh ../dot-next.tar.gz | awk '{print "artifact_size=" $5}' | tee -a "$GITHUB_STEP_SUMMARY"
      # Run-scoped name, one-day retention: only this run's prod shards consume
      # the build; no deploy path reads CI artifacts. The name carries no
      # attempt number on purpose: "Re-run failed jobs" re-runs a prod shard
      # without re-running this job, and that shard must still find the build.
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-prodbuild-${{ github.run_id }}
          path: dot-next.tar.gz
          # After one day the build is gone. A prod shard re-run later than
          # that fails at its download and says so: use "Re-run all jobs",
          # which rebuilds, not "Re-run failed jobs".
          retention-days: 1

  terminal-e2e-prodbuild:
    concurrency:
      group: terminal-ci-${{ github.event.pull_request.number || github.ref }}-terminal-e2e-prodbuild-${{ matrix.shard }}
      cancel-in-progress: true
    name: Terminal e2e ${{ matrix.shard }} (prod build)
    needs: [pr_scope, e2e-scope, terminal-e2e-build]
    # The build job's own condition plus its success. Without a build these
    # shards skip instead of failing one by one at the download; the required
    # aggregate below turns both the failed build and that skip red.
    if: ${{ !cancelled() && needs.e2e-scope.result == 'success' && needs.terminal-e2e-build.result == 'success' && github.event_name != 'merge_group' && needs.e2e-scope.outputs.prodbuild_count != '0' && !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
    # Hosted-only for Stage 1: the prodbuild lane has no self-hosted lane
    # binding yet; the variable-gated dev lane is untouched.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-scope.outputs.prodbuild_matrix) }}
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Restore-only: this lane never SAVES a browser cache entry, so nothing a
      # PR controls can be written into a cache scope other refs restore.
      - name: Restore Playwright browsers (restore-only)
        id: pwcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers (apt bounded, browser-only fallback)
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          timeout 480 npx playwright install --with-deps chromium \
            || { echo "::warning::apt/--with-deps stalled or failed — installing the browser only"; \
                 npx playwright install chromium; }
      - name: Ensure browser present on cache hit
        if: steps.pwcache.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: timeout --signal=TERM --kill-after=15s 240s npx playwright install --with-deps chromium
      - name: Download production build artifact (this run only)
        id: prodbuild_artifact
        uses: actions/download-artifact@v4
        with:
          name: e2e-prodbuild-${{ github.run_id }}
          path: terminal
      - name: Explain a missing production build artifact
        if: failure() && steps.prodbuild_artifact.outcome == 'failure'
        run: |
          echo "::error title=terminal-e2e-prodbuild::The production build artifact e2e-prodbuild-${GITHUB_RUN_ID} is missing or expired. It is kept for 1 day and only the build job of this run creates it. For a stale re-run use 'Re-run all jobs' so the build runs again; 'Re-run failed jobs' cannot recreate it."
          exit 1
      - name: Unpack production build
        run: |
          rm -rf .next
          tar -xzf dot-next.tar.gz
          rm dot-next.tar.gz
      - name: Run allowlisted specs against next start
        run: >-
          npm run test:e2e:responsive -- -c playwright.prodbuild.config.ts
          ${{ matrix.projects }} ${{ matrix.specs }} --workers=1
        env:
          CI: "1"
          TERMINAL_E2E_PORT: "3108"
      - name: Upload prod-lane QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # prod shard names are prodbuild-* so they cannot collide with the
          # dev lane's responsive-qa-<run_id>-<shard> artifact names.
          name: responsive-qa-${{ github.run_id }}-${{ matrix.shard }}
          path: terminal/test-results
          if-no-files-found: ignore

  terminal:
    # Stable required context: both selectors and every selected shard feed it.
    name: Terminal typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pr_scope, e2e-scope, terminal-unit, terminal-e2e, terminal-e2e-build, terminal-e2e-prodbuild]
    if: always()
    steps:
      - name: Refuse cancelled qualification
        if: cancelled()
        run: |
          echo "::error title=terminal-ci::Workflow cancellation cannot qualify skipped work"
          exit 1
      - name: Assert all event-required Terminal checks passed
        if: ${{ !cancelled() }}
        env:
          SCOPE: ${{ needs.e2e-scope.result }}
          PR_SCOPE: ${{ needs.pr_scope.result }}
          PR_MODE: ${{ needs.pr_scope.outputs.mode }}
          UNIT: ${{ needs.terminal-unit.result }}
          E2E: ${{ needs.terminal-e2e.result }}
          BUILD: ${{ needs.terminal-e2e-build.result }}
          PRODBUILD: ${{ needs.terminal-e2e-prodbuild.result }}
          PRODBUILD_COUNT: ${{ needs.e2e-scope.outputs.prodbuild_count }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "event=$EVENT pr_scope:$PR_SCOPE mode=$PR_MODE e2e-scope:$SCOPE terminal-unit:$UNIT terminal-e2e:$E2E terminal-e2e-build:$BUILD terminal-e2e-prodbuild:$PRODBUILD (count=$PRODBUILD_COUNT)"
          docs_only=0
          if [ "$EVENT" = "pull_request" ] && [ "$PR_SCOPE" = "success" ] && [ "$PR_MODE" = "docs" ]; then
            docs_only=1
          fi
          fail=0
          # The independent browser selector is mandatory for every event,
          # including docs-only PRs and the native merge-group fast lane.
          if [ "$SCOPE" != "success" ]; then
            echo "::error title=terminal-ci::e2e-scope concluded '$SCOPE' (expected 'success')"
            fail=1
          fi
          if [ "$UNIT" = "success" ]; then
            :
          elif [ "$docs_only" -eq 1 ] && [ "$UNIT" = "skipped" ]; then
            echo "terminal-unit skipped: trusted docs-only pull request"
          else
            echo "::error title=terminal-ci::terminal-unit concluded '$UNIT' (expected 'success')"
            fail=1
          fi
          if [ "$E2E" = "success" ]; then
            :
          elif [ "$E2E" = "skipped" ] && { [ "$docs_only" -eq 1 ] || [ "$EVENT" = "merge_group" ]; }; then
            echo "terminal-e2e skipped: qualified docs-only PR or native merge group"
          else
            echo "::error title=terminal-ci::terminal-e2e concluded '$E2E' (expected 'success')"
            fail=1
          fi
          # The prod lane must FAIL, never silently skip: a failed or cancelled
          # build/prod shard turns this required context red. Skips are lawful
          # only where the job itself is allowed to skip (merge_group, trusted
          # docs-only PR) or the selector emitted no prod shards.
          if [ "$BUILD" = "success" ]; then
            :
          elif [ "$BUILD" = "skipped" ] && { [ "$docs_only" -eq 1 ] || [ "$EVENT" = "merge_group" ] || [ "$PRODBUILD_COUNT" = "0" ]; }; then
            echo "terminal-e2e-build skipped: qualified docs-only PR, native merge group, or empty prod lane"
          else
            echo "::error title=terminal-ci::terminal-e2e-build concluded '$BUILD' (expected 'success')"
            fail=1
          fi
          if [ "$PRODBUILD" = "success" ]; then
            :
          elif [ "$PRODBUILD" = "skipped" ] && { [ "$docs_only" -eq 1 ] || [ "$EVENT" = "merge_group" ] || [ "$PRODBUILD_COUNT" = "0" ]; }; then
            echo "terminal-e2e-prodbuild skipped: qualified docs-only PR, native merge group, or empty prod lane"
          else
            echo "::error title=terminal-ci::terminal-e2e-prodbuild concluded '$PRODBUILD' (expected 'success')"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "All event-required Terminal checks green."

  python:
    concurrency:
      group: terminal-ci-${{ github.event.pull_request.number || github.ref }}-python
      cancel-in-progress: true
    name: Ingest + signal-layer tests
    runs-on: ubuntu-latest
    needs: [pr_scope]
    # A docs-only pull request (pr_scope mode=docs) still COMPLETES this
    # required context green: every step below is skipped, so branch
    # protection and scripts/merge_on_green.py (`conclusion == success`)
    # read it as proven. `!cancelled()` keeps the job running when pr_scope
    # itself failed or was skipped: mode is then empty and every step runs.
    if: ${{ !cancelled() }}
    # GitHub GraphQL native mergeQueue and source PR membership are read-only;
    # contents:read alone cannot authenticate the queue's pull-request objects.
    # Keep write privileges absent on the candidate-controlled merge_group path.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        uses: actions/checkout@v4
      # The Scenario PostgreSQL qualification drives the actual TypeScript HTTP
      # consumer in this same job. Python and PostgreSQL alone cannot run it.
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        name: Install Terminal consumer test dependencies
        run: npm ci
        working-directory: terminal
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The MINIMAL import closure of tests/ + the ingest/signal_layer modules they pull in,
      # verified in a clean venv — the whole suite passes there with ZERO skips (a skip here
      # would mean a dependency is missing and a test is silently not running):
      #   numpy, pandas  — signal_layer.confluence / confluence_v2 and the tests directly
      #   pyarrow        — pandas' parquet engine, used by tests/test_golden_gate.py
      #   jsonschema     — tests/test_seasonal_regime.py. NOT optional: it is guarded by an
      #                    importorskip, so omitting it turns a real assertion into a silent
      #                    SKIP and the job goes green having tested nothing there.
      #   pyyaml         — tests/test_merge_on_green.py parses this very file's own YAML to
      #                    check the candidate-CI permission guard, so a raw text/regex match
      #                    can't misread a comment or a `run:` shell block as a real job key.
      # requirements.txt additionally carries fastapi/uvicorn, which nothing under tests/
      # imports — installing them would only slow the job down.
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        run: |
          ingest_python_env="$(mktemp -d "${RUNNER_TEMP:?}/terminal-ingest-python.XXXXXX")"
          python -m venv "$ingest_python_env"
          "$ingest_python_env/bin/python" -m pip --isolated install numpy pandas pyarrow jsonschema pyyaml requests yfinance==1.4.1 pytest
          printf '%s\n' "$ingest_python_env/bin" >> "$GITHUB_PATH"
      # Keep the broad ingest suite fail-closed when PostgreSQL binaries are missing.
      # The dedicated upstream Investigation job remains an additional gate.
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        name: Put PostgreSQL binaries on PATH
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        name: Require PostgreSQL rather than silently skip
        run: |
          command -v initdb
          command -v pg_ctl
          command -v psql
      # Run as `python -m pytest` from the repo root: that is what puts the root on sys.path,
      # which is how `import ingest.…` / `import signal_layer.…` resolve (there is no
      # conftest.py and no installed package).
      # PR_NUMBER is what lets the supabase/migrations namespace guard run its
      # pull-request rule (scripts/check_supabase_migration_namespace.py,
      # resolve_run_mode): on a PR branch a present .sql may carry an "open"
      # ledger row only for THIS pull request, and any other present+open row is
      # a stale ledger. Without it the guard's one enforcement rule is reachable
      # only from a push to master, which no workflow here triggers. It is a
      # number, not a credential, and it widens no authority: this step gains
      # exactly one environment variable and nothing else.
      # The `|| inputs.pr_number` half covers the fallback workflow_dispatch run
      # merge-on-green orders after refreshing a stale branch (round 4, MAJOR 2):
      # on that trigger github.event.pull_request.number is empty, and that
      # dispatched run is then the only CI run for the sha that merges.
      - if: ${{ !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
        id: ingest_tests
        run: python -m pytest tests/ -q
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          # The original built-in-token queue read was forbidden. Do not retry
          # it from a later predictive candidate. With no open migration the
          # strict guard needs no API; with one it refuses before network.
          # The separate protected issuer/required-gate transfer is not active.
          GH_TOKEN: ''
      - name: Validate safe Ingest outcome publication
        id: safe_ingest_summary
        if: ${{ always() && steps.ingest_tests.outputs.safe_pytest_report_initialized == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          PYTEST_DIRECTORY_DEV: ${{ steps.ingest_tests.outputs.safe_pytest_directory_dev }}
          PYTEST_DIRECTORY_INO: ${{ steps.ingest_tests.outputs.safe_pytest_directory_ino }}
          PYTEST_FILE_DEV: ${{ steps.ingest_tests.outputs.safe_pytest_file_dev }}
          PYTEST_FILE_INO: ${{ steps.ingest_tests.outputs.safe_pytest_file_ino }}
          PYTEST_FILE_SHA256: ${{ steps.ingest_tests.outputs.safe_pytest_file_sha256 }}
          PYTEST_STEP_OUTCOME: ${{ steps.ingest_tests.outcome }}
        run: python scripts/ci_pytest_results.py --publish-safe-summary
      - name: Retain bounded Ingest pytest outcome
        if: ${{ always() && steps.safe_ingest_summary.outcome == 'success' && steps.safe_ingest_summary.outputs.safe_pytest_summary_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ingest-safe-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.safe_ingest_summary.outputs.safe_pytest_summary_path }}
          if-no-files-found: warn

  investigation-postgres:
    concurrency:
      group: terminal-ci-${{ github.event.pull_request.number || github.ref }}-investigation-postgres
      cancel-in-progress: true
    name: Investigation PostgreSQL invariants
    runs-on: ubuntu-latest
    needs: [pr_scope]
    # Skipped only for a qualified docs-only pull request (pr_scope
    # mode=docs); a failed, skipped or unqualified pr_scope runs everything.
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'docs') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          python -m pip install pytest==8.3.5
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Require PostgreSQL rather than silently skip
        run: |
          command -v initdb
          command -v pg_ctl
          command -v psql
      - name: Exercise migration, replay, CAS and owner isolation
        run: python -m pytest tests/test_investigation_postgres.py tests/test_thesis_proposal_postgres.py tests/test_api_watchlist_write_postgres.py tests/test_forex_watch_postgres.py tests/test_alerts_frozen_hit_postgres.py tests/test_alerts_frozen_prepared_postgres.py tests/test_portfolio_target_role_postgres.py tests/test_options_frozen_migration_postgres.py tests/test_options_frozen_enrollment_postgres.py -q
      - name: Exercise drawing snapshots, replacement and actual competing sessions
        run: python tests/sql/audit04/run_native_fixture.py --out-dir "$RUNNER_TEMP/audit04-evidence"
