  before/favorites-after-refused-390-zh.png: { url: "/terminal?symbol=NVDA", tree: master, injected: { "GET /api/drawings": 500 }, then: "tapped Trend lines > Trend line (refused), reopened sheet, Favorites", observed: { mm.drawRecents: '["trendline"]' } }
