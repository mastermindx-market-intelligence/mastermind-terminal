surface: NVDA daily chart with the fixture script "My Momentum" added; the Pine Worker never boots (host.ts boot timer 30000ms shortened to 8000ms, its one boot retry intact), then Retry with the engine healthy
capture_flag: TERMINAL_E2E_FIXTURE
capture_flag_law: next.config.ts sets devIndicators to false when TERMINAL_E2E_FIXTURE is set; this script starts next dev with the same flag.
command: |
  cd terminal
  node e2e/tools/capture_pine_boot_pending.cjs
