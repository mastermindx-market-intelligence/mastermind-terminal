name: vps-main-deploy
# Fast wake after a protected Terminal master update. No PR-head execution,
# direct worktree sync or parallel publisher: the existing exact-source
# terminal-build.sh owns preflight, build lock, atomic swap and rollback.
on:
  push:
    branches: [master]
    paths:
      - "terminal/**"
      - "ingest/**"
      - "signal_layer/**"
      - "scripts/**"
      - "config/**"
      - "contracts/**"
      - "hub/**"
      - "ops/terminal-build.sh"
      - "ops/terminal-data"
  workflow_dispatch: {}

permissions:
  contents: read

# Keep the actively building generation alive. GitHub may coalesce stale
# pending wake-ups; the next accepted wake deploys the latest protected master.
concurrency:
  group: terminal-vps-main-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'mastermindx-market-intelligence/mastermind-terminal' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Read pinned accepted source and host identity
        uses: actions/checkout@v4
        with:
          sparse-checkout: ops/vps_origin_known_hosts
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Invoke existing exact-commit Terminal production builder
        shell: bash
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VPS_DEPLOY_KEY" ] || { echo "::error::VPS_DEPLOY_KEY not configured in this repository"; exit 1; }
          PIN="$GITHUB_WORKSPACE/ops/vps_origin_known_hosts"
          [ -s "$PIN" ] || { echo "::error::VPS host pin missing"; exit 1; }
          grep -qx '146.190.142.17 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEc8ibhWOj35RC4FXjydG27GMxKfjiVXOw0s7hiCySkk' "$PIN" ||
            { echo "::error::VPS host pin mismatch"; exit 1; }

          # Deploy the CURRENT protected master to absorb coalesced main pushes;
          # never interpret the original event SHA as a release target after it
          # has been superseded. The incumbent builder independently fetches and
          # verifies that this exact SHA belongs to its protected origin/master.
          TARGET_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::Could not pin current protected master"; exit 1; }
          echo "::notice::Terminal target is protected master $TARGET_SHA"

          umask 077
          KEYFILE="$(mktemp "$RUNNER_TEMP/terminal-vps-key.XXXXXX")"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$KEYFILE"

          # The remote owner validates full Git history, the CLEAN source
          # preflight, activation profile and the production .deployment-id.
          ssh -F /dev/null -i "$KEYFILE" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$PIN" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=15 \
            root@146.190.142.17 \
            "set -eu;
             test -r /opt/terminal/terminal-build.sh;
             bash /opt/terminal/terminal-build.sh --target production --target-sha '$TARGET_SHA';
             installed=\$(cat /opt/terminal/terminal/.deployment-id);
             test \"\$installed\" = '$TARGET_SHA';
             printf 'Verified Terminal production marker: %s\\n' \"\$installed\""
